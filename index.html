<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NYC Grid Pulse — New York City's electricity in real time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* House system v5 ("black"), adapted for a live dashboard. Old variable names are
     kept as aliases so the chart code keeps reading them; values are v5 tokens. */
  :root {
    --bg: #111311; --bg2: #1b1e1b; --fg: #f2f3ef; --fg2: #a2a8a1;
    --line: #3a3f3a; --line2: #262a26; --grid: rgba(255,255,255,.13);
    --cobalt:#5b86ff; --vermilion:#ff6a45; --sun:#ffd23f; --mint:#3fd68f;
    --rose:#ff6fae; --cyan:#3cc8d8; --orange:#ff9f2e; --lilac:#b79bff;
    --accent: var(--sun);
    /* aliases used throughout the page code */
    --panel: var(--bg); --panel2: var(--bg2);
    --text: var(--fg); --muted: var(--fg2); --faint: #7f857e;
    --amber: var(--sun); --green: var(--mint); --red: var(--vermilion);
    --blue: var(--cobalt); --purple: var(--lilac); --lime: #c6e25a; --gas: var(--rose);
    --sans: 'Karla', system-ui, -apple-system, sans-serif;
    --display: 'Archivo', system-ui, sans-serif;
    --mono: var(--sans);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: var(--fg); text-decoration-color: var(--fg2); text-underline-offset: 2px; }
  b, strong { font-weight: 700; color: var(--fg); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 22px 22px 90px; }

  /* opening: top line, name, one plain finding, lede */
  .topline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px; font-size: 13px; color: var(--fg2); padding-bottom: 14px; border-bottom: 1px solid var(--line2); }
  .topline .state { font-weight: 700; color: var(--mint); }
  .topline .state.late { color: var(--sun); }
  .topline .state.stale { color: var(--vermilion); }
  h1 { font-family: var(--display); font-variation-settings: "wdth" 100; font-size: clamp(1.9rem,3.2vw,2.6rem); font-weight: 800; letter-spacing: -.01em; line-height: 1.05; margin: 26px 0 12px; }
  .finding { font-family: var(--display); font-variation-settings: "wdth" 96; font-size: clamp(1.2rem,1.9vw,1.55rem); font-weight: 600; line-height: 1.3; max-width: 860px; margin: 0 0 12px; }
  .finding .n { color: var(--accent); }
  .lede { max-width: 800px; color: var(--fg2); margin: 0 0 8px; }
  .lede b { color: var(--fg); }
  .banner { background: var(--sun); color: #121412; padding: 14px 18px; margin: 18px 0 4px; font-weight: 600; }
  .banner b { color: #121412; }

  /* sections and cards: no boxes, shadows or rounded corners */
  .sec { margin-top: 10px; }
  .grid { display: grid; gap: 34px; align-items: start; }
  .cols-2 { grid-template-columns: 1.15fr .85fr; }
  .cols-2b { grid-template-columns: 1fr 1fr; }
  .card { border-top: 1px solid var(--line2); padding: 22px 0 8px; margin-top: 8px; }
  .card h2 { font-family: var(--display); font-variation-settings: "wdth" 100; font-size: 21px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.005em; }
  .card .desc { color: var(--fg2); font-size: 15px; margin: 0 0 16px; max-width: 780px; }
  .section-tag { font-family: var(--display); font-variation-settings: "wdth" 100; font-size: clamp(1.45rem,2.3vw,1.85rem); font-weight: 800; color: var(--fg); margin: 58px 0 2px; letter-spacing: -.01em; }

  /* figures written as keyed sentences, not tiles */
  .runs { margin: 14px 0 8px; }
  .runrow { display: grid; grid-template-columns: 190px 1fr 270px; gap: 4px 14px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line2); font-size: 14.5px; }
  .runrow .bar { height: 12px; background: var(--line2); }
  .runrow .bar i { display: block; height: 100%; }
  .runrow .sub { color: var(--faint); font-size: 12.5px; }
  .runrow .nm b { font-weight: 600; }
  .runscale { display: grid; grid-template-columns: 190px 1fr 270px; gap: 14px; font-size: 12px; color: var(--faint); }
  .runscale span { display: flex; justify-content: space-between; }
  .rulelist { margin: 6px 0 0; padding-left: 18px; }
  .rulelist li { margin: 0 0 10px; }
  .hero, .keyrow { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 34px; margin: 10px 0 6px; }
  .stat { padding: 0; }
  .stat .label { display: none; }
  .stat .big { font-family: var(--display); font-size: 20px; font-weight: 700; line-height: 1.25; display: inline; }
  .stat .unit { font-weight: 700; color: inherit; }
  .stat .note { display: inline; font-size: 15px; color: var(--fg2); }
  .stat .note::before { content: " — "; }

  /* fuel mix */
  .gentop { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; margin-top: 6px; }
  .mix { display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: center; }
  .donut-wrap { position: relative; width: 200px; height: 200px; }
  .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .donut-center .pct { font-family: var(--display); font-size: 34px; font-weight: 800; color: var(--mint); }
  .donut-center .cap { font-size: 13px; color: var(--fg2); }
  .legend { display: flex; flex-direction: column; gap: 8px; }
  .legrow { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 10px; align-items: center; font-size: 15px; }
  .swatch { width: 13px; height: 13px; }
  .legrow .mw { color: var(--fg2); font-variant-numeric: tabular-nums; }
  .legrow .pct { color: var(--fg); width: 52px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .splitbar { display: flex; height: 26px; overflow: hidden; margin-top: 4px; }
  .splitbar > div { display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#121412; }

  /* charts */
  .chart { width: 100%; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { font-family: var(--sans); }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .tip { position: fixed; pointer-events: none; background: var(--bg2); border: 1px solid var(--line); padding: 9px 11px; font-size: 13.5px; color: var(--fg); z-index: 30; opacity: 0; transition: opacity .08s; max-width: 250px; }
  .tip .t-time { color: var(--fg2); font-size: 12.5px; margin-bottom: 5px; }
  .tip .t-row { display:flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }

  .miniflex { display:flex; gap: 8px 30px; flex-wrap: wrap; margin-top: 8px; }
  .mini .k { font-size: 13.5px; color: var(--fg2); }
  .mini .v { font-family: var(--display); font-size: 19px; font-weight: 700; margin-top: 1px; font-variant-numeric: tabular-nums; }

  /* zone bars and city bars */
  .zbar { display: grid; grid-template-columns: 112px 1fr 96px; align-items: center; gap: 12px; margin: 6px 0; font-size: 15px; }
  .zbar .zname { color: var(--fg2); }
  .zbar .ztrack { background: var(--bg2); height: 20px; position: relative; overflow:hidden; }
  .zbar .zfill { height: 100%; }
  .zbar .zval { text-align: right; font-variant-numeric: tabular-nums; line-height:1.2; font-weight: 600; }
  .zbar .zval .znow { display:block; font-size: 12.5px; color: var(--faint); font-weight: 400; }
  .zbar.nyc .zname { color: var(--sun); font-weight: 700; }
  .gcrow { display: grid; grid-template-columns: 170px 1fr 70px; align-items: center; gap: 12px; margin: 7px 0; }
  .gcname { font-size: 15px; line-height: 1.25; }
  .gcname .gcregion { display: block; font-size: 12.5px; color: var(--faint); }
  .gcname .gcflag { font-size: 12px; color: var(--faint); margin-left: 5px; }
  .gctrack { background: var(--bg2); height: 22px; overflow: hidden; }
  .gcfill { height: 100%; }
  .gcrow.hl .gcname { color: var(--sun); font-weight: 700; }
  .gcval { text-align: right; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; }

  .lead { }
  .dsstats { display: flex; gap: 8px 30px; flex-wrap: wrap; margin: 8px 0 14px; }
  .dsstat .v { font-family: var(--display); font-size: 26px; font-weight: 800; line-height: 1.1; display: inline; }
  .dsstat .k { display: inline; font-size: 15px; color: var(--fg2); margin-left: 6px; }
  .dsbar { display: flex; height: 26px; overflow: hidden; margin-top: 4px; }
  .dsbar > div { min-width: 1px; }
  .dslegend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 14px; }
  .dslegend .li { display: flex; align-items: center; gap: 6px; color: var(--fg2); }
  .dslegend .sw { width: 11px; height: 11px; flex-shrink: 0; }
  .dslegend .mw { color: var(--faint); }

  /* the long explanations fold away */
  details.more { margin-top: 12px; border-top: 1px solid var(--line2); }
  details.more summary { cursor: pointer; padding: 10px 0 4px; font-size: 15px; font-weight: 700; color: var(--fg); list-style: none; }
  details.more summary::-webkit-details-marker { display: none; }
  details.more summary::after { content: " +"; color: var(--fg2); font-weight: 400; }
  details.more[open] summary::after { content: " −"; }
  details.more .body { font-size: 15px; color: var(--fg2); padding: 2px 0 8px; max-width: 820px; }
  .solarnote, .ipnote { font-size: 15px; color: var(--fg2); margin-top: 14px; }
  .solarnote b { color: var(--lime); }
  .ipnote b { color: var(--lilac); }

  /* Champlain Hudson meter */
  .gauge { position: relative; height: 26px; background: var(--bg2); margin: 14px 0 6px; }
  .gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cyan); }
  .gauge .cap { position: absolute; right: 0; top: 30px; font-size: 13px; color: var(--fg2); }
  .gauge-scale { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg2); margin-bottom: 14px; }

  /* look-ahead */
  .hours { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; align-items: end; height: 120px; margin-top: 8px; }
  .hours > div { background: var(--cobalt); opacity: .55; }
  .hours > div.lo { background: var(--mint); opacity: 1; }
  .hours > div.hi { background: var(--vermilion); opacity: 1; }
  .hourlabels { display: grid; grid-template-columns: repeat(24, 1fr); font-size: 12px; color: var(--faint); margin-top: 4px; }
  .hourlabels span { text-align: center; }
  .days { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 24px; }
  .days li { font-size: 15px; color: var(--fg2); }
  .days li b { display: block; font-family: var(--display); font-size: 19px; color: var(--fg); }
  .days li.hot b { color: var(--vermilion); }

  /* methodology */
  details.method { margin-top: 56px; border-top: 1px solid var(--line); padding: 4px 0; }
  details.method summary { cursor: pointer; padding: 16px 0; font-family: var(--display); font-weight: 700; font-size: 19px; list-style: none; }
  details.method summary::-webkit-details-marker { display:none; }
  details.method summary::after { content: " +"; color: var(--fg2); font-weight: 400; }
  details.method[open] summary::after { content: " −"; }
  details.method .body { padding-bottom: 18px; color: var(--fg2); font-size: 15px; max-width: 860px; }
  details.method h4 { color: var(--fg); font-size: 15px; margin: 18px 0 6px; }
  details.method a { color: var(--fg); }
  details.method code { background: var(--bg2); padding: 1px 5px; font-size: 13.5px; color: var(--cyan); font-family: ui-monospace, Menlo, monospace; }
  details.method table { width:100%; border-collapse: collapse; font-size: 14px; margin-top: 6px;}
  details.method td, details.method th { text-align:left; padding: 4px 8px; border-bottom: 1px solid var(--line2); }
  details.method th { color: var(--fg); }
  details.method td.n { text-align:right; }

  footer { margin-top: 40px; color: var(--faint); font-size: 13.5px; }
  footer a { color: var(--fg2); }

  @media (max-width: 880px) {
    .cols-2, .cols-2b, .gentop { grid-template-columns: 1fr; }
    .mix { grid-template-columns: 1fr; justify-items: center; }
  }
  @media (max-width: 560px) {
    .hero, .keyrow { grid-template-columns: 1fr; }
    .runrow, .runscale { grid-template-columns: 1fr; }
    .runscale > div:first-child, .runscale > div:last-child { display: none; }
    .zbar { grid-template-columns: 92px 1fr 84px; }
    .gcrow { grid-template-columns: 120px 1fr 56px; }
  }
  .err { background: var(--bg2); color: var(--vermilion); padding: 14px 16px; font-size: 15px; }

  .toggle { display:inline-flex; border:1px solid var(--line); flex-shrink:0; }
  .toggle button { background: transparent; border:0; color: var(--fg2); font: inherit; font-size: 14px; font-weight:600; padding: 6px 12px; cursor:pointer; white-space:nowrap; }
  .toggle button.active { background: var(--fg); color: var(--bg); }

  #peakerMap { height: 380px; margin-top:4px; background: var(--bg2); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--bg2); color: var(--fg); border-radius: 0; box-shadow: none; border:1px solid var(--line); }
  .leaflet-popup-content { font-family: var(--sans); font-size: 14px; margin: 10px 12px; }
  .leaflet-popup-content b { color: var(--sun); }
  .leaflet-container { font-family: var(--sans); }
  .plist-wrap { overflow-x:auto; }
  .plist { width:100%; border-collapse:collapse; font-size:14.5px; margin-top:14px; }
  .plist th { text-align:left; color:var(--fg2); font-weight:600; font-size:13.5px; padding:6px 8px; border-bottom:1px solid var(--line); }
  .plist td { padding:6px 8px; border-bottom:1px solid var(--line2); }
  .plist td.n { text-align:right; font-variant-numeric:tabular-nums; }
  .plist .fuel-oil { color: var(--vermilion); }
  .plist .fuel-gas { color: var(--orange); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topline">
    <span>Source: New York Independent System Operator (NYISO) public feeds, refreshed every 5 minutes</span>
    <span id="updated">Loading…</span>
  </div>
  <h1>NYC Grid Pulse</h1>
  <p class="finding" id="finding"></p>
  <p class="lede" id="lede"></p>
  <div id="banner"></div>

  <div id="root"></div>

  <details class="method">
    <summary>Methodology, sources and definitions</summary>
    <div class="body" id="method"></div>
  </details>

  <footer>
    Data: <a href="https://www.nyiso.com/real-time-dashboard" target="_blank" rel="noopener">NYISO real-time dashboard</a> and public CSV feeds.
    This is an independent visualization, not affiliated with NYISO. Not an official source.
  </footer>
</div>
<div class="tip" id="tip"></div>

<script>
const FUEL_COLORS = {
  "Nuclear": "var(--purple)",
  "Hydro": "var(--cyan)",
  "Wind": "var(--green)",
  "Other Renewables": "var(--lime)",
  "Dual Fuel": "var(--gas)",
  "Natural Gas": "var(--orange)",
  "Other Fossil Fuels": "var(--red)",
};
const FUEL_ORDER = ["Nuclear","Hydro","Wind","Other Renewables","Dual Fuel","Natural Gas","Other Fossil Fuels"];
const CLEAN = new Set(["Nuclear","Hydro","Wind","Other Renewables"]);
const ZONE_LABELS = {
  "N.Y.C.":"New York City","LONGIL":"Long Island","HUD VL":"Hudson Valley","DUNWOD":"Dunwoodie",
  "MILLWD":"Millwood","CAPITL":"Capital","CENTRL":"Central","GENESE":"Genesee","MHK VL":"Mohawk Valley",
  "NORTH":"North","WEST":"West"
};

// Indian Point Energy Center net summer capacity (EIA): Unit 2 ~1,020 MW + Unit 3 ~1,040 MW.
// Unit 2 retired 2020-04-30, Unit 3 retired 2021-04-30.
const INDIAN_POINT_MW = 2060;
const FOSSIL_CATS = ["Natural Gas","Dual Fuel","Other Fossil Fuels"];

function mixStats(cats, factors, cleanSet){
  const total = Object.values(cats).reduce((a,b)=>a+b,0);
  let clean=0, co2=0;
  for(const [c,mw] of Object.entries(cats)){ if(cleanSet.has(c)) clean+=mw; co2 += mw*(factors[c]??0); }
  return { total, cleanMW:clean, fossilMW: total-clean, cleanPct: total?clean/total*100:0, co2Rate: total?co2/total:0 };
}
// counterfactual: add nuclear, displace fossil proportionally, hold total generation constant
function withIndianPoint(cats){
  const out = {...cats};
  out["Nuclear"] = (out["Nuclear"]||0) + INDIAN_POINT_MW;
  const fsum = FOSSIL_CATS.reduce((a,f)=>a+(out[f]||0),0);
  if(fsum > INDIAN_POINT_MW){ const k=(fsum-INDIAN_POINT_MW)/fsum; for(const f of FOSSIL_CATS) if(out[f]) out[f]*=k; }
  return out;
}

const fmt = (n, d=0) => n==null ? "—" : Number(n).toLocaleString("en-US",{maximumFractionDigits:d, minimumFractionDigits:d});
const tip = document.getElementById("tip");
function showTip(html, x, y){ tip.innerHTML=html; tip.style.opacity=1; tip.style.left=Math.min(x+14, innerWidth-250)+"px"; tip.style.top=(y+14)+"px"; }
function hideTip(){ tip.style.opacity=0; }
function hhmm(t){ const d=t.split("T")[1]; return d.slice(0,5); }
function pad2(n){ return String(n).padStart(2,"0"); }
// AP-style clock time from "…THH:MM:SS": 9 a.m., 9:05 a.m., noon, midnight
// "8:35 a.m.." -> "8:35 a.m." when a time ends a sentence (also across a closing </b>)
function tidy(h){ return h.replace(/([ap])\.m\.(<\/b>)?\./g, "$1.m.$2"); }
function apTime(t){ const [h,m]=hhmm(t).split(":").map(Number); return apHour(h, m); }
function apHour(h, m=0){
  if(m===0 && h===12) return "noon"; if(m===0 && (h===0||h===24)) return "midnight";
  const ap = h%24<12 ? "a.m." : "p.m."; const h12 = h%12 || 12;
  return (m ? h12+":"+pad2(m) : h12)+" "+ap;
}
// contiguous hour runs, e.g. [1,2,3,17,18] -> "1 to 4 a.m. and 5 to 7 p.m." (each hour is an hour-long block)
function hourRuns(hours){
  const hs=[...new Set(hours)].sort((a,b)=>a-b); const runs=[];
  for(const h of hs){ const r=runs[runs.length-1]; if(r && h===r[1]+1) r[1]=h; else runs.push([h,h]); }
  const one = ([a,b]) => { const s=apHour(a), e=apHour(b+1);
    const sa=s.split(" ")[1], ea=e.split(" ")[1];
    return (sa && sa===ea ? s.split(" ")[0] : s)+" to "+e; };
  return runs.map(one).join(runs.length>2 ? ", " : " and ").replace(/, ([^,]*)$/, " and $1");
}
const WEEKDAY=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON_AP=["Jan.","Feb.","March","April","May","June","July","Aug.","Sept.","Oct.","Nov.","Dec."];
function apDay(iso){ const [y,m,d]=iso.split("-").map(Number); const dt=new Date(Date.UTC(y,m-1,d)); return WEEKDAY[dt.getUTCDay()]+", "+MON_AP[m-1]+" "+d; }
function addDaysIso(iso, n){ const [y,m,d]=iso.split("-").map(Number); const dt=new Date(Date.UTC(y,m-1,d+n)); return dt.toISOString().slice(0,10); }
// round axis ticks: steps of 1, 2, 2.5 or 5 times a power of ten
function niceScale(lo, hi, target=4){
  if(!(hi>lo)) hi = lo + 1;
  const raw=(hi-lo)/target, mag=Math.pow(10, Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(k=>k*mag).find(st=>st>=raw);
  const a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step, ticks=[];
  for(let v=a; v<=b+step/2; v+=step) ticks.push(+v.toFixed(6));
  return {lo:a, hi:b, step, ticks, dec: step<1 ? (step<0.1?2:1) : (step%1 ? 1 : 0)};
}

function cssVar(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || v; }

// ---------- main ----------
function load(){
  const bust = "?_=" + Date.now();
  Promise.all([
    fetch("data/latest.json" + bust).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); }),
    // baseline.json and peakers.json are built on slower schedules; treat as optional
    fetch("data/baseline.json" + bust).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch("data/peakers.json" + bust).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch("data/grid-carbon.json" + bust).then(r => r.ok ? r.json() : null).catch(() => null),
    // heat-demand.json is a static historical build (build-heat-demand.py); optional
    fetch("data/heat-demand.json" + bust).then(r => r.ok ? r.json() : null).catch(() => null),
    // daily-load.json is a static historical build (build-daily-load.py); optional
    fetch("data/daily-load.json" + bust).then(r => r.ok ? r.json() : null).catch(() => null),
    // daily-grid.json: a year of price, mix, carbon, imports and the Quebec line (build-daily-grid.py)
    fetch("data/history/daily-grid.json" + bust).then(r => r.ok ? r.json() : null).catch(() => null),
    // peaker-runs.json: how many hours each peaker ran, from EPA emissions reporting (build-peaker-runs.py)
    fetch("data/peaker-runs.json" + bust).then(r => r.ok ? r.json() : null).catch(() => null),
  ])
    .then(([D, B, Pk, GC, HD, DL, DG, PR]) => { document.getElementById("root").innerHTML=""; render(D, B, Pk, GC, HD, DL, DG, PR); })
    .catch(e => {
      document.getElementById("root").innerHTML =
        '<div class="err">Could not load grid data ('+e.message+'). The snapshot file <code>data/latest.json</code> may not have been generated yet. Run <code>node fetch-data.mjs</code>.</div>';
    });
}
load();
// re-pull the snapshot every 5 minutes so an open tab stays current
setInterval(load, 5 * 60 * 1000);

// Current Eastern wall-clock time as "YYYY-MM-DDTHH:MM:SS" — the same shape as
// NYISO timestamps in latest.json, so the two compare as strings.
function easternNowIso(){
  const parts = new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const g = t => parts.find(p=>p.type===t).value;
  return g("year")+"-"+g("month")+"-"+g("day")+"T"+g("hour")+":"+g("minute")+":"+g("second");
}
// minutes between two Eastern wall-clock strings (both naive, same zone)
function minutesBetween(a, b){ return Math.round((new Date(b+"Z") - new Date(a+"Z")) / 60000); }
function ageText(min){ return min < 60 ? min+" min" : (min/60 < 10 ? (min/60).toFixed(1).replace(/\.0$/,"") : Math.round(min/60))+" hr"; }

function render(D, B, Pk, GC, HD, DL, DG, PR){
  const L = D.latest;
  const nowEt = easternNowIso();

  // NYISO's real-time price file runs ~2.5 hours ahead of the clock with advisory
  // (forecast) intervals. fetch-data.mjs drops them now; this guard also cleans
  // older snapshots, and keeps the price "now" from ever being a future interval.
  D.price = (D.price||[]).filter(p => p.t <= nowEt);
  {
    const lastP = D.price[D.price.length-1];
    const pr = lastP?.zones?.["N.Y.C."]?.lbmp ?? null;
    L.priceT = lastP?.t ?? null;
    L.nycPriceLbmp = pr;
    L.nycSpendPerHour = (pr!=null && L.nycLoadMW!=null) ? Math.round(L.nycLoadMW*pr) : null;
    const da = L.priceT ? (D.dayAhead||[]).find(d => d.t.slice(0,13) === L.priceT.slice(0,13)) : null;
    L.nycDayAheadLbmp = da ? da.nyc : null;
    L.rtVsDaPct = (da && pr!=null) ? +(((pr-da.nyc)/da.nyc)*100).toFixed(1) : null;
  }

  // ---------- updated line: say plainly how old the reading is ----------
  const readingAge = Math.max(0, minutesBetween(L.t, nowEt));
  const fresh = readingAge <= 20, late = !fresh && readingAge <= 90;
  const state = fresh ? "" : late ? " late" : " stale";
  const badge = fresh ? "Live" : late ? "Delayed" : "Not current";
  const dateNote = L.t.slice(0,10) !== nowEt.slice(0,10) ? " on "+L.t.slice(0,10) : "";
  document.getElementById("updated").innerHTML =
    '<span class="state'+state+'">'+badge+'</span>: reading of '+apTime(L.t)+' Eastern'+dateNote+
    (fresh ? "" : ", "+ageText(readingAge)+" old; the page updates itself as new data arrives");

  // ---------- running wholesale spend today (integrate load × price over 5-min steps) ----------
  const priceByT = new Map(D.price.map(p => [p.t, p.zones?.["N.Y.C."]?.lbmp]));
  let spendToday = 0, mwhToday = 0;
  for(const l of D.load){
    if(l.nyc==null) continue;
    const pr = priceByT.get(l.t);
    const hours = 5/60;
    mwhToday += l.nyc * hours;
    if(pr!=null) spendToday += l.nyc * pr * hours;
  }

  const centsKwh = L.nycPriceLbmp!=null ? (L.nycPriceLbmp/10) : null; // $/MWh ÷ 10 = ¢/kWh

  // Every block below appends to one of these, so the page reads top to bottom in this order
  // whatever order the code builds things in.
  const SEC = {};
  const root = document.getElementById("root");
  for(const k of ["lead","chpe","mix","today","cost","ahead","carbon","history","year","heat","peakers","cities"]){
    SEC[k] = el("section","sec"); root.append(SEC[k]);
  }

  buildOpening(D, B, HD, {nowEt, mwhToday, spendToday, centsKwh});

  // ================= WHERE THE POWER COMES FROM =================
  SEC.mix.append(sectionTag("Where the power comes from"));

  // ---- LEAD: downstate (NYC region) mix — the primary picture, with the marquee donut ----
  if(GC && GC.downstate){
    const ds = GC.downstate;
    const DS_COLORS = {"Dual fuel (gas/oil)":"var(--gas)","Natural gas":"var(--orange)","Oil":"var(--red)","Hydro":"var(--cyan)","Waste energy":"var(--faint)","Solar":"var(--lime)","Offshore wind":"var(--green)"};
    const dsOrdered = ds.mix.map(m=>({name:m.fuel, mw:m.gwh, pct:m.pct}));
    const lead = el("div","card lead");
    lead.append(h2("How the New York City region is powered",
      "Energy produced in NYISO's downstate region (Zones F–K — New York City, Long Island and the lower Hudson Valley) in "+ds.year+", from the NYISO Power Trends report. This is the most representative picture of the city's power; the statewide live feed below runs cleaner only because New York's nuclear and hydro sit upstate."));
    // marquee: donut + legend
    const top = el("div","mix");
    const dleft = el("div"); dleft.style.cssText="display:flex;justify-content:center";
    dleft.append(donut(dsOrdered, ds.totalGWh, ds.zeroEmissionPct, {colors:DS_COLORS, unit:"GWh", centerCap:"zero-emission"}));
    top.append(dleft, legend(dsOrdered, ds.totalGWh, {colors:DS_COLORS, unit:"GWh"}));
    lead.append(top);
    // supporting stat tiles
    const stats = el("div","dsstats"); stats.style.marginTop="20px";
    const mk = (v,k,color)=>{ const d=el("div","dsstat"); const a=el("div","v"); a.textContent=v; a.style.color=color; const b=el("div","k"); b.textContent=k; d.append(a,b); return d; };
    stats.append(
      mk(ds.fossilPct+"%","fossil fuel","var(--red)"),
      mk(ds.nuclearPct+"%","nuclear","var(--purple)"),
      mk(ds.zeroEmissionPct+"%","zero-emission","var(--green)")
    );
    lead.append(stats);
    const dsc = el("div"); dsc.style.cssText="color:var(--faint);font-size:12.5px;margin-top:14px";
    dsc.innerHTML = "Roughly <b>"+ds.fossilPct+"% fossil and "+ds.zeroEmissionPct+"% zero-emission</b>, with <b>no nuclear</b> — versus <b>"+ds.statewideZeroEmissionPct+"% zero-emission statewide</b>. Transmission constraints limit how much of upstate's clean power reaches the city. Total downstate production "+fmt(ds.totalGWh)+" GWh in "+ds.year+". Annual figures, not real-time. These are "+ds.year+" figures and predate the Champlain Hudson Power Express (see below), which began delivering Canadian hydropower to the city in June 2026. Source: "+ds.source;
    lead.append(dsc);
    if(GC.nycSolar){
      const s=GC.nycSolar; const sn=fold("Solar in the city, against its goal", "New York City had about <b>"+fmt(s.installedMW)+" MW</b> of solar installed citywide in "+s.year+" — roughly "+fmt(s.installedMW/s.goalMW*100,0)+"% of the city's goal of <b>"+fmt(s.goalMW/1000,0)+" gigawatt ("+fmt(s.goalMW)+" MW) by "+s.goalYear+"</b>, generating about "+fmt(s.generationGWh)+" GWh that year. "+s.note+" Source: "+s.source);
      lead.append(sn);
    }
    SEC.mix.append(lead);

  }

  // ---- Champlain Hudson Power Express, live: the one clean intertie row in NYISO's flow feed ----
  {
    const C = (D.chpe||[]);
    SEC.chpe.append(sectionTag("The Quebec hydro line, live"));
    const ch = el("div","card"); ch.style.borderTop="0";
    const last = C[C.length-1];
    const cap = last?.limit || 1250;
    const p = el("p","desc"); p.style.cssText="font-size:17px;color:var(--fg);max-width:820px";
    if(last){
      const avg = C.reduce((a,c)=>a+c.mw,0)/C.length;
      const mx = C.reduce((m,c)=>c.mw>m.mw?c:m, C[0]), mn = C.reduce((m,c)=>c.mw<m.mw?c:m, C[0]);
      const share = L.nycLoadMW ? last.mw/L.nycLoadMW*100 : null;
      p.innerHTML = "At "+apTime(last.t)+", <b>"+fmt(last.mw)+" megawatts</b> of Hydro-Québec power was scheduled across the Champlain Hudson Power Express into Astoria, Queens. That is "+fmt(last.mw/cap*100,0)+"% of the line's "+fmt(cap)+" MW"+(share!=null? " and about "+fmt(share,0)+"% of what the city is drawing" : "")+". Since midnight the schedule has averaged "+fmt(avg)+" MW, between "+fmt(mn.mw)+" and "+fmt(mx.mw)+" MW.";
    } else {
      p.textContent = "NYISO's interchange feed carried no schedule for the line in this snapshot.";
    }
    ch.append(p);
    if(last){
      const g = el("div","gauge"); const f = el("div","fill"); f.style.width = Math.max(0,Math.min(100,last.mw/cap*100))+"%"; g.append(f); ch.append(g);
      const sc = el("div","gauge-scale"); sc.innerHTML = "<span>0</span><span>"+fmt(cap)+" MW, the line's capacity</span>"; ch.append(sc);
      ch.append(h4mini("Scheduled flow since midnight, megawatts"));
      ch.append(lineChart(C.map(c=>({t:c.t, v:c.mw})), {color:cssVar("--cyan"), unit:"MW", fill:true}));
    }
    const note = el("p","desc"); note.style.marginTop="12px";
    note.textContent = "These are NYISO's scheduled flows on the line, the figure it posts every 5 minutes for each link to a neighboring grid; metered flow can differ slightly. The line reached commercial operation on May 13, 2026, and contracted deliveries began June 1, 2026. It is built to deliver about 10.4 terawatt-hours a year under a 25-year contract, up to about a fifth of the city's demand, roughly a million homes' worth.";
    ch.append(note);
    ch.append(fold("Why this hydropower isn't a slice of the fuel mix below",
      "The live and downstate mixes count electricity <b>generated inside New York</b>, broken out by fuel. Power on this line is generated in Canada and delivered across the border, so in grid accounting it is <i>interchange</i>, not in-state generation, and NYISO's fuel-mix feed doesn't break imports out by fuel. It is counted in the <b>net imports</b> line beneath the live mix (statewide load minus in-state generation), which folds every intertie together: this line plus New England and PJM. That is why the clean share of the fuel slices understates the carbon-free electricity reaching the city."));
    ch.append(fold("Will Quebec keep sending power?",
      "How much the line actually carries depends on Hydro-Québec's supply. Several years of low water drew down Quebec's reservoirs, and the utility cut its electricity exports sharply in 2022–2024, while Canadian demand from data centers and industry keeps rising. Hydro-Québec says it is managing its reserves and will keep limiting exports as conditions require. Sources: CBC and The Energy Mix, 2024–2026."));
    SEC.chpe.append(ch);
  }

  const total = L.genTotalMW;

  const mixCard = el("div","card");
  const mixHead = el("div"); mixHead.style.cssText="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap";
  mixHead.append(h2("Statewide mix, live", "For reference: the only fuel mix NYISO publishes in real time is statewide ("+fmt(total)+" MW now, through the day at right). It runs cleaner than the downstate picture above because the state's nuclear and hydro are upstate."));
  const toggle = el("div","toggle");
  const bToday = el("button"); bToday.textContent="As generated"; bToday.className="active";
  const bIP = el("button"); bIP.textContent="If Indian Point ran";
  toggle.append(bToday, bIP); mixHead.append(toggle);
  mixCard.append(mixHead);

  // compact: live mix (left, no donut) + through-the-day chart (right)
  const topGrid = el("div","gentop");
  const liveBody = el("div");
  const dayCol = el("div");
  dayCol.append(h4mini("Through the day (since midnight, hover for detail)"));
  dayCol.append(stackedArea(D.fuelMix));
  topGrid.append(liveBody, dayCol);
  mixCard.append(topGrid);

  const ipNote = el("div","ipnote"); ipNote.style.display="none";
  mixCard.append(ipNote);

  const actualStats = mixStats(L.fuelCats, D.co2FactorsLbsPerMWh, CLEAN);
  function drawMix(withIP){
    liveBody.innerHTML="";
    const cats = withIP ? withIndianPoint(L.fuelCats) : L.fuelCats;
    const st = mixStats(cats, D.co2FactorsLbsPerMWh, CLEAN);
    const ord = FUEL_ORDER.filter(f=>cats[f]!=null && cats[f]>0).map(f=>({name:f, mw:cats[f], pct:cats[f]/st.total*100}));
    const head = el("div"); head.style.cssText="font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-1px;line-height:1";
    head.innerHTML = fmt(st.cleanPct,0)+'%<span style="font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0"> carbon-free · '+fmt(st.fossilMW/st.total*100,0)+'% fossil</span>';
    liveBody.append(head);
    const bar = el("div","dsbar"); bar.style.marginTop="12px";
    for(const o of ord){ const seg=el("div"); seg.style.width=o.pct+"%"; seg.style.background=FUEL_COLORS[o.name]||"var(--line)"; seg.title=o.name+" "+fmt(o.pct,1)+"%"; bar.append(seg); }
    liveBody.append(bar);
    const leg = el("div","dslegend"); leg.style.marginTop="11px";
    for(const o of ord){ const li=el("div","li"); const sw=el("span","sw"); sw.style.background=FUEL_COLORS[o.name]||"var(--line)"; const t=document.createElement("span"); t.innerHTML=o.name+" <span class='mw'>"+fmt(o.pct,1)+"%</span>"; li.append(sw,t); leg.append(li); }
    liveBody.append(leg);
    // ---- Net imports (derived): statewide load minus in-state generation ----
    // Captures every intertie — Quebec hydro on the Champlain Hudson Power Express,
    // PJM and New England — none of which appear in NYISO's in-state fuel-mix feed.
    // withIndianPoint() holds generation total constant, so this figure is the same
    // under either toggle. Approximate: ignores line losses and pumped-storage charging.
    const netImp = L.stateLoadMW - st.total;
    const imp = el("div"); imp.style.cssText="margin-top:14px";
    if(netImp > 0){
      const impPct = netImp / L.stateLoadMW * 100;
      const row = el("div"); row.style.cssText="display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted)";
      const sw=el("span"); sw.style.cssText="width:11px;height:11px;flex-shrink:0;background:repeating-linear-gradient(45deg,var(--cyan),var(--cyan) 2px,transparent 2px,transparent 4px);border:1px solid var(--cyan)";
      const t=document.createElement("span");
      t.innerHTML="Net imports <span class='mw'>+"+fmt(netImp)+" MW · "+fmt(impPct,1)+"% of statewide load</span>";
      row.append(sw,t); imp.append(row);
      const note=fold("How net imports are figured", "Statewide load minus in-state generation: power flowing in over the interties, including Quebec hydro on the Champlain Hudson Power Express, plus New England and PJM. NYISO's real-time mix counts only in-state generation, so these megawatts show up here rather than as a slice above. For scale, New York imported <b>38,785 GWh</b> and exported 18,148 GWh in 2024 — net imports near <b>20,600 GWh</b>, roughly a seventh of the state's electricity (NYISO 2025 Gold Book). Approximate — excludes line losses and pumped-storage charging.");
      imp.append(note);
    } else {
      const note=el("div"); note.style.cssText="font-size:11.5px;color:var(--faint);line-height:1.5";
      note.innerHTML="<b>Net imports:</b> New York is a net <i>exporter</i> right now — in-state generation exceeds statewide load, so there are no net imports to show this reading.";
      imp.append(note);
    }
    liveBody.append(imp);
    if(withIP){
      ipNote.style.display="";
      ipNote.innerHTML = "<b>Illustrative — Indian Point retired 2020–2021.</b> The Indian Point nuclear plant near New York City (Unit 2 ~1,020 MW, retired April 30 2020; Unit 3 ~1,040 MW, retired April 30 2021; ~2,060 MW net total, per the U.S. Energy Information Administration) ran around the clock as baseload. Restoring its output and displacing an equal amount of fossil generation would lift the statewide carbon-free share from <b>"+fmt(actualStats.cleanPct,1)+"%</b> to <b>"+fmt(st.cleanPct,1)+"%</b> and cut the grid's carbon intensity from <b>"+fmt(actualStats.co2Rate,0)+"</b> to <b>"+fmt(st.co2Rate,0)+"</b> lbs CO₂/MWh right now. This shows the scale of the lost carbon-free supply; the real grid would have dispatched other plants differently.";
    } else { ipNote.style.display="none"; ipNote.innerHTML=""; }
  }
  bToday.onclick=()=>{ bToday.className="active"; bIP.className=""; drawMix(false); };
  bIP.onclick=()=>{ bIP.className="active"; bToday.className=""; drawMix(true); };
  drawMix(false);

  // Behind-the-meter rooftop solar disclosure (static; the feed can't see it)
  const btm = fold("Rooftop solar, about 7.5 GW of it, is missing from this mix", "New York has roughly <b>7,500 MW</b> of behind-the-meter solar (NYISO 2025 Gold Book) that this feed can't see: it sits on the customer side of the meter, so it registers as <i>reduced demand</i>, not supply. On a clear spring midday it generates as much as <b>~4,800 MW</b>, and it shaves about <b>1,600 MW — near 5%</b> — off the summer peak, all invisible above. That's why the carbon-free share is understated on sunny days. It does not distort the net-imports line: rooftop output is netted out of both load and generation, so it cancels.");
  mixCard.append(btm);

  // CLCPA policy context (static; persists across the toggle)
  const renPct = total ? ((L.fuelCats["Hydro"]||0)+(L.fuelCats["Wind"]||0)+(L.fuelCats["Other Renewables"]||0))/total*100 : null;
  const clcpa = fold("The state climate law and its 2030 target", "New York's Climate Leadership and Community Protection Act (2019) requires 70% of electricity from <b>renewable</b> sources by 2030 and a 100% <b>zero-emission</b> grid by 2040. The 70% goal counts renewables only — wind, solar and hydro, about "+fmt(renPct,0)+"% of statewide generation right now — while the carbon-free share above also includes nuclear. In a July 2024 draft review, state regulators (the New York State Energy Research and Development Authority and the Department of Public Service) projected the 70% target will not be met until about 2033.");
  mixCard.append(clcpa);

  // What's generated inside NYC itself (statewide mix is misleading for the city)
  if(GC && GC.nycInCity){
    const ic = GC.nycInCity;
    const nucNow = total ? (L.fuelCats["Nuclear"]||0)/total*100 : 0;
    const inCity = el("div"); inCity.style.cssText="";
    const sb = el("div","splitbar"); sb.style.margin="9px 0 4px";
    const gd = el("div"); gd.style.width=ic.gasPct+"%"; gd.style.background=cssVar("--orange"); gd.style.color="#1a1206"; gd.textContent=ic.gasPct+"% natural gas";
    const od = el("div"); od.style.width=(100-ic.gasPct)+"%"; od.style.background=cssVar("--line");
    sb.append(gd, od);
    inCity.innerHTML = "The mix above is <b>statewide</b>. Power generated within the five boroughs and Westchester is about <b>"+ic.gasPct+"% natural gas, with 0% nuclear and 0% hydro</b> (EPA eGRID, "+ic.year+"). New York's nuclear and large hydro are all upstate; Indian Point — the only plant near the city — closed in 2021, so the "+fmt(nucNow,1)+"% nuclear shown above does not come from the city's own generation.";
    inCity.append(sb);
    const ichist = el("div"); ichist.style.cssText="margin-top:6px";
    ichist.innerHTML = "<b style='color:var(--orange)'>The Indian Point arc.</b> When it ran, the Indian Point nuclear plant just north of the city was widely cited as about a quarter of the electricity used in New York City and Westchester (a figure that is debated, since power can't be metered to a specific load). Its closure in 2021 removed the area's main carbon-free baseload — largely replaced, in the near term, by natural gas.";
    inCity.append(ichist);
    const ictail = el("div"); ictail.style.cssText="margin-top:6px"; ictail.innerHTML = "This is generation <i>located</i> in the city; New York City also imports a large share of its power, and imported electricity can't be cleanly traced to a specific fuel.";
    inCity.append(ictail);
    mixCard.append(fold("What's generated inside the city itself", inCity));
  }
  SEC.mix.append(mixCard);

  // ================= WHAT NYC IS CONSUMING =================
  SEC.today.append(sectionTag("Today's demand, hour by hour"));

  const loadCard = el("div","card");
  loadCard.append(h2("New York City load vs. NYISO forecast", "Megawatts drawn by Zone J since midnight (solid), against NYISO's own day-ahead zonal load forecast (dashed). Both are the same metric from the same operator, so they compare directly."));
  loadCard.append(lineChart(D.load.map(l=>({t:l.t, v:l.nyc})),
    {color:cssVar("--amber"), unit:"MW", fill:true, label:"Actual load",
     compare:{data:(D.forecast||[]).filter(f=>f.t.startsWith(D.sourceDate)).map(f=>({t:f.t, v:f.nyc})), color:cssVar("--muted"), label:"NYISO forecast"}}));
  const lmini = el("div","miniflex");
  const minNyc = D.load.reduce((m,l)=> l.nyc!=null && l.nyc<m.v ? {v:l.nyc,t:l.t}:m, {v:Infinity,t:null});
  const vsF = L.loadVsForecastPct;
  lmini.append(
    mini("Now", fmt(L.nycLoadMW)+" MW"),
    mini("vs forecast", (vsF>0?"+":"")+fmt(vsF,1)+"% · "+fmt(L.nycForecastMW)+" MW"),
    mini("Peak today", fmt(L.peakNyc.mw)+" MW at "+apTime(L.peakNyc.t)),
    mini("Energy so far today", fmt(mwhToday/1000,1)+" GWh")
  );
  loadCard.append(lmini);

  // NYC vs rest-of-state share area
  const shareCard = el("div","card");
  shareCard.append(h2("New York City's share of statewide demand", "Zone J load as a percent of all 11 zones, through the day."));
  shareCard.append(lineChart(D.load.map(l=>({t:l.t, v: l.nyc!=null&&l.total? l.nyc/l.total*100 : null})), {color:cssVar("--blue"), unit:"%", fill:true, dec:1}));
  const smini = el("div","miniflex");
  smini.append(mini("Now", fmt(L.nycSharePct,1)+"%"), mini("Statewide load now", fmt(L.stateLoadMW)+" MW"));
  shareCard.append(smini);

  const g2 = el("div","grid cols-2b"); g2.append(loadCard, shareCard);
  SEC.today.append(g2);

  // today vs. a normal day (needs baseline.json)
  if(B && B.typicalDay?.slots?.length){
    const todaySlots = D.load.filter(l=>l.nyc!=null).map(l=>({slot:hhmm(l.t), v:l.nyc}));
    // prior-year lines are chosen for a specific date; hide them if the baseline was built for another day
    const priors = B.forDate===nowEt.slice(0,10) ? (B.priorYears||[]).filter(p=>p.curve?.length) : [];
    const TD = B.typicalDay;
    const kind = TD.dayType==="weekday" ? "weekdays" : "weekends and holidays";
    const MON = ["Jan.","Feb.","March","April","May","June","July","Aug.","Sept.","Oct.","Nov.","Dec."];
    const apDate = (iso, yr) => { const [y,m,d]=iso.split("-"); return MON[+m-1]+" "+(+d)+(yr?", "+y:""); };
    const bandCard = el("div","card"); bandCard.style.borderTop="0";
    bandCard.append(h2("Today against a normal day",
      "New York City load today (solid) against the "+TD.daysUsed+" "+kind+" of the past four weeks"+(TD.windowStart? " ("+apDate(TD.windowStart)+" to "+apDate(TD.windowEnd)+")" : "")+" — the shaded band spans the 10th to 90th percentile, the dashed line is the median. "+(priors.length? "Faint lines are the same weekday one, two and three years back, so a "+(priors[0].weekday||"weekday")+" is compared with a "+(priors[0].weekday||"weekday")+"." : "")));
    bandCard.append(bandChart(todaySlots, B.typicalDay.slots, priors));
    // legend
    const lg=el("div"); lg.style.cssText="display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);margin-top:8px";
    const priorColors=["var(--purple)","var(--lime)","var(--orange)"];
    let lgHtml='<span><span style="display:inline-block;width:14px;height:3px;background:var(--amber);vertical-align:middle;margin-right:5px"></span>Today</span>'+
      '<span><span style="display:inline-block;width:14px;height:0;border-top:2px dashed var(--blue);vertical-align:middle;margin-right:5px"></span>Median, recent '+kind+'</span>'+
      '<span><span style="display:inline-block;width:14px;height:10px;background:var(--blue);opacity:.2;vertical-align:middle;margin-right:5px"></span>Typical range (10th–90th pct)</span>';
    priors.forEach((p,i)=>{ lgHtml+='<span><span style="display:inline-block;width:14px;height:2px;background:'+priorColors[i%3]+';vertical-align:middle;margin-right:5px"></span>'+apDate(p.date,true)+'</span>'; });
    lg.innerHTML=lgHtml; bandCard.append(lg);
