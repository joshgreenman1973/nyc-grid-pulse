      tr.innerHTML = "<td>"+p.plant+"</td><td>"+p.borough+"</td><td class='n'>"+fmt(p.netSummerMW)+" MW</td>"+
        "<td class='"+(oil?"fuel-oil":"fuel-gas")+"'>"+p.fuels.join(", ")+"</td><td class='n'>"+(p.minYear||"—")+"</td>";
      tbl.append(tr);
    }
    const tblWrap = el("div","plist-wrap"); tblWrap.append(tbl); pk.append(tblWrap);
    if(PR && PR.plants?.length) pk.append(runsBlock(PR, Pk));

    // real-time category-level "fossil swing supply" — honest proxy for peaking activity
    const cats = L.fuelCats || {};
    const dispatchable = (cats["Dual Fuel"]||0) + (cats["Natural Gas"]||0) + (cats["Other Fossil Fuels"]||0);
    const oilNow = cats["Other Fossil Fuels"]||0;
    const oilMaxToday = Math.max(0, ...D.fuelMix.map(f=>f.cats["Other Fossil Fuels"]||0));
    const swingHead = el("div"); swingHead.style.cssText="margin-top:22px"; swingHead.append(h4mini("Dispatchable fossil generation right now (statewide)"));
    pk.append(swingHead);
    const sflex = el("div","miniflex");
    sflex.append(
      mini("Gas + dual-fuel + oil", fmt(dispatchable)+" MW"),
      mini("Oil-fired now", fmt(oilNow)+" MW"),
      mini("Oil-fired peak today", fmt(oilMaxToday)+" MW")
    );
    pk.append(sflex);
    const pn = el("div"); pn.style.cssText="color:var(--faint);font-size:12.5px;margin-top:12px";
    pn.innerHTML = "When demand climbs, the grid leans on dispatchable fossil generation — and oil-fired output (NYISO's \"other fossil fuels\") is the last resort, appearing mainly under stress. NYISO reports this by fuel category statewide and does not publish unit-level output, so these megawatts cannot be attributed to the specific plants mapped above. The map and list are verified locations (U.S. EIA); the real-time figures are the closest public signal of peaking activity, not a plant-by-plant readout.";
    pk.append(pn);

    const src = el("div"); src.style.cssText="color:var(--faint);font-size:12px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px";
    src.innerHTML = "Source: "+Pk.source+". Definition: "+Pk.definition;
    pk.append(src);
    SEC.peakers.append(pk);

    // init Leaflet map (LL = Leaflet global; the local `L` here is D.latest). Graceful if the library failed to load.
    const LL = window.L;
    if(LL && LL.map){
      try {
        const map = LL.map("peakerMap", { scrollWheelZoom:false }).setView([40.715,-73.95], 11);
        LL.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_2r82_1_ae4e70b6166057bc41b89638",
          { attribution:'&copy; OpenStreetMap &copy; CARTO', subdomains:"abcd", maxZoom:18 }).addTo(map);
        Pk.plants.forEach(p=>{
          if(p.lat==null||p.lon==null) return;
          const oil = p.fuels.some(f=>/oil|kerosene|jet/.test(f));
          const r = Math.max(5, Math.sqrt(p.netSummerMW)*0.95);
          LL.circleMarker([p.lat,p.lon], { radius:r, color:"var(--bg)", weight:1, fillColor: oil?"#f97362":"#fb923c", fillOpacity:0.78 })
            .addTo(map)
            .bindPopup("<b>"+p.plant+"</b><br>"+p.borough+" · online "+(p.minYear||"?")+"<br>"+fmt(p.netSummerMW)+" MW net · "+p.fuels.join(", ")+"<br>"+p.primeMovers.join("/")+" (simple-cycle)");
        });
        setTimeout(()=>map.invalidateSize(), 100);
      } catch(e){ document.getElementById("peakerMap").style.display="none"; }
    } else { document.getElementById("peakerMap").style.display="none"; }
  }

  // ================= A YEAR OF DEMAND (day by day) =================
  if(DL && DL.days?.length){
    const MONF=["January","February","March","April","May","June","July","August","September","October","November","December"];
    const MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const fday=iso=>{ const [y,m,d]=iso.split("-"); return MON_AP[+m-1]+" "+(+d)+", "+y; };
    const s=DL.stats;
    SEC.year.append(sectionTag("A year of demand, day by day"));
    const yc = el("div","card");
    yc.append(h2("A year of New York City power, day by day",
      "Every day from "+fday(DL.start)+" to "+fday(DL.end)+" — the city's electricity use as one point per day. The big summer hump is air conditioning; a smaller winter rise comes with long nights and some electric heat; the troughs are spring and fall, when little is cooling or heating. NYISO Zone J."));

    const srow = el("div","hero"); srow.style.marginBottom="18px";
    srow.append(
      statCard("Year's total", fmt(s.energyTotalTWh,1), "TWh used", cssVar("--cyan"), "Sum of daily consumption across all "+DL.nDays+" days in the window."),
      statCard("Busiest day", fmt(s.energyMax), "GWh", cssVar("--red"), "Most electricity used in a single day — "+fday(s.energyMaxDate)+"."),
      statCard("Highest peak", fmt(s.peakMax), "MW", cssVar("--orange"), "The single highest 5-minute demand of the year, on "+fday(s.peakMaxDate)+"."),
      statCard("Quietest day", fmt(s.energyMin), "GWh", cssVar("--blue"), "Least used — "+fday(s.energyMinDate)+", a mild low-demand day.")
    );
    yc.append(srow);

    const ctrl = el("div"); ctrl.style.cssText="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap";
    const mtg = el("div","toggle");
    const bEnergy = el("button"); bEnergy.textContent="Energy used (GWh)"; bEnergy.className="active";
    const bPeak = el("button"); bPeak.textContent="Peak demand (MW)";
    mtg.append(bEnergy, bPeak); ctrl.append(mtg);
    const ztg = el("div","toggle");
    const bZoom = el("button"); bZoom.textContent="Zoom to data"; bZoom.className="active";
    const bZero = el("button"); bZero.textContent="Start axis at zero";
    ztg.append(bZoom, bZero); ctrl.append(ztg);
    yc.append(ctrl);

    const holder = el("div"); let metric="energy", zero=false;
    const draw=()=>{ holder.innerHTML=""; holder.append(dailyChart(DL.days, {metric, zero})); };
    bEnergy.onclick=()=>{ metric="energy"; bEnergy.className="active"; bPeak.className=""; draw(); };
    bPeak.onclick=()=>{ metric="peak"; bPeak.className="active"; bEnergy.className=""; draw(); };
    bZoom.onclick=()=>{ zero=false; bZoom.className="active"; bZero.className=""; draw(); };
    bZero.onclick=()=>{ zero=true; bZero.className="active"; bZoom.className=""; draw(); };
    yc.append(holder); draw();

    const src = el("div"); src.style.cssText="color:var(--faint);font-size:12px;margin-top:14px;border-top:1px solid var(--line);padding-top:10px";
    src.innerHTML =
      "<b>Method.</b> "+DL.source+". For each day: <b>peak</b> is the maximum of that day's 5-minute readings; <b>energy used</b> is the day's average load × 24 hours (an average-times-hours integral, robust to the few extra readings archived days carry). "+DL.nDays+" days shown"+(DL.missing?.length ? " ("+DL.missing.length+" days in the window are missing because NYISO no longer serves them)" : "")+". Every day once captured is kept, since NYISO's public archive drops days. This is a real-time metered-load series — behind-the-meter rooftop solar is netted out of it, so true consumption on sunny days runs a little higher. Built by <code>build-daily-load.py</code> (re-runnable); no value is hand-entered. Snapshot "+DL.generatedAt+".";
    yc.append(src);
    SEC.year.append(yc);
  }

  // ================= HEAT VS DEMAND =================
  if(HD && HD.points?.length){
    const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const fdate=iso=>{ const [y,m,d]=iso.split("-"); return MON_AP[+m-1]+" "+(+d)+", "+y; };
    const s=HD.stats;
    SEC.heat.append(sectionTag("Heat and demand"));
    const hd = el("div","card");
    hd.append(h2("How heat drives demand",
      "New York City's summer power demand rises with air-conditioning use. Each dot is one summer day, "+HD.range+" — its high temperature against the city's peak load (NYISO Zone J). Hotter day, higher peak."));

    const srow = el("div","hero"); srow.style.marginBottom="18px";
    const jump = fmt((s.hotQuartileAvg/s.mildAvg-1)*100);
    srow.append(
      statCard("Temp vs peak", s.rTemp.toFixed(2), "correlation", cssVar("--amber"), "0 = none, 1 = lockstep. Feels-like temperature tracks even tighter, at "+s.rFeels.toFixed(2)+"."),
      statCard("Each +1°F adds", "+"+fmt(s.slopeMwPerF), "MW to the peak", cssVar("--orange"), "Least-squares slope across "+HD.nDays+" summer days."),
      statCard("Mild day (<75°F)", fmt(s.mildAvg), "MW peak", cssVar("--cyan"), "Average daily peak on cool summer days."),
      statCard("Hottest quarter", fmt(s.hotQuartileAvg), "MW peak", cssVar("--red"), "Average on the hottest 25% of days — a "+jump+"% jump.")
    );
    hd.append(srow);

    const ctrl = el("div"); ctrl.style.cssText="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap";
    ctrl.append(h4mini("Every summer day, "+HD.range+" (hover a dot)"));
    const tg = el("div","toggle");
    const bZoom = el("button"); bZoom.textContent="Zoom to data"; bZoom.className="active";
    const bZero = el("button"); bZero.textContent="Start axis at zero";
    tg.append(bZoom, bZero); ctrl.append(tg); hd.append(ctrl);

    const leg = el("div"); leg.style.cssText="display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);margin-bottom:8px";
    leg.innerHTML =
      "<span><span style='display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cyan);opacity:.6;vertical-align:middle;margin-right:5px'></span>summer day</span>"+
      "<span><span style='display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);vertical-align:middle;margin-right:5px'></span>very hot day (≥95°F)</span>"+
      "<span><span style='display:inline-block;width:15px;height:3px;background:var(--amber);vertical-align:middle;margin-right:5px'></span>average peak by temperature</span>";
    hd.append(leg);

    const holder = el("div"); let zero=false;
    const draw=()=>{ holder.innerHTML=""; holder.append(scatterChart(HD.points, HD.line, {zero})); };
    bZoom.onclick=()=>{ zero=false; bZoom.className="active"; bZero.className=""; draw(); };
    bZero.onclick=()=>{ zero=true; bZero.className="active"; bZoom.className=""; draw(); };
    hd.append(holder); draw();

    const th = el("div"); th.style.marginTop="20px"; th.append(h4mini("The hottest days in the window, and New York City's peak demand"));
    hd.append(th);
    const tbl = el("table","plist");
    tbl.innerHTML = "<tr><th>Date</th><th class='n'>High</th><th class='n'>Feels like</th><th class='n'>NYC peak</th></tr>";
    for(const r of HD.hottest){
      const tr=el("tr");
      tr.innerHTML = "<td>"+fdate(r.date)+"</td><td class='n'>"+fmt(r.tmax,1)+"°F</td><td class='n'>"+(r.feels!=null?fmt(r.feels,0)+"°F":"—")+"</td><td class='n'>"+fmt(r.peak)+" MW</td>";
      tbl.append(tr);
    }
    const tblWrap = el("div","plist-wrap"); tblWrap.append(tbl); hd.append(tblWrap);

    const note = el("div"); note.style.cssText="color:var(--faint);font-size:12.5px;margin-top:14px";
    const pk = HD.peakDays.find(p=>p.tmax < 93) || HD.peakDays[0];
    note.innerHTML =
      "Peak demand <b>flattens near "+fmt(s.maxPeak)+" MW</b> — the window's high, set on "+fdate(s.maxPeakDate)+". Above roughly 95°F nearly every air conditioner is already running, so extra degrees add little more load. And the biggest-demand days aren't always the hottest: "+fdate(pk.date)+" hit <b>"+fmt(pk.peak)+" MW at only "+fmt(pk.tmax,0)+"°F</b> (feels-like "+fmt(pk.feels,0)+"°F) — sustained, humid heat with no overnight cooling loads the grid as hard as a one-day spike, which is why feels-like temperature ("+s.rFeels.toFixed(2)+") predicts demand better than the raw high ("+s.rTemp.toFixed(2)+").";
    hd.append(note);

    const src = el("div"); src.style.cssText="color:var(--faint);font-size:12px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px";
    src.innerHTML =
      "<b>Method.</b> Demand: "+HD.loadSource+" — each day's peak is the maximum of its 5-minute readings. Temperature: "+HD.tempSource+" — daily maximum air and apparent (\"feels-like\") temperature. "+HD.nDays+" days matched by date over "+HD.range+". Correlation is Pearson's r; the per-degree figure is a least-squares slope. Built by <code>build-heat-demand.py</code> (re-runnable); no value here is hand-entered. Snapshot "+HD.generatedAt+".";
    hd.append(src);
    SEC.heat.append(hd);
  }

  buildMethod(D);
}

// ---------- component builders ----------
function el(tag, cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }
function spanT(cls, txt){ const s=el("span",cls); s.textContent=txt; return s; }
function h2(title, desc){ const w=el("div"); const a=el("h2"); a.textContent=title; const b=el("p","desc"); b.textContent=desc; w.append(a,b); return w; }
function h4mini(t){ const e=el("div"); e.style.cssText="font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600"; e.textContent=t; return e; }
// How often each peaker ran, from EPA emissions reporting (data/peaker-runs.json,
// built by build-peaker-runs.py), plus each plant's status under the state peaker rule.
function shortPlant(n){
  return n.replace(" Gas Turbines Generating","").replace(" Power Project","").replace(" Peaking Facility LLC","")
          .replace(" Peaking","").replace("Astoria Generating Station","Astoria gas turbine");
}
function runsBlock(PR, Pk){
  const w = el("div"); w.style.marginTop = "28px";
  const Y = "2025";
  const [ytdY, ytdQ] = (PR.ytdThrough||"").split("-Q");
  const ytdEnd = ["March","June","September","December"][(+ytdQ||1)-1];
  const fuelOf = name => (Pk.plants.find(q=>q.plant===name)||{}).fuels || [];
  const rows = PR.plants.filter(p=>p.covered).map(p=>{
    const a = p.years[Y]||{}, b = p.years[ytdY]||{};
    return { p, name: shortPlant(p.plant), cc: /combined-cycle/i.test((p.notes||[]).join(" ")),
      oil: fuelOf(p.plant).length>0 && fuelOf(p.plant).every(f=>/oil|kerosene|jet/.test(f)),
      hrs: a.operatingHoursMaxUnit||0, days: a.daysAnyUnitOperated, mwh: a.grossLoadMWh||0, nox: a.noxTons,
      hrsYtd: b.operatingHoursMaxUnit||0 };
  }).sort((a,b)=>b.hrs-a.hrs);
  const peak = rows.filter(r=>!r.cc);
  const busiest = peak[0];
  const mostDays = [...peak].sort((a,b)=>(b.days||0)-(a.days||0))[0];
  const idle = peak.filter(r=>r.hrs < 25);
  const T = PR.totalsExcludingCombinedCycle || {};
  const gn = peak.filter(r=>/^(Gowanus|Narrows)/.test(r.name)).reduce((s,r)=>s+(r.nox||0),0);
  const noxY = T[Y]?.noxTons, nox23 = T["2023"]?.noxTons, noxYtd = T[ytdY]?.noxTons;
  const list = a => a.length<2 ? a.join("") : a.slice(0,-1).join(", ")+" and "+a[a.length-1];

  w.append(h4mini("How often each plant ran"));
  const lead = el("p"); lead.style.cssText = "margin:4px 0 10px;max-width:860px";
  lead.innerHTML =
    "Leaving out East River, a combined-cycle plant that runs almost every day, the busiest peaker in "+Y+" was <b>"+busiest.name+"</b>: its busiest turbine ran "+
    fmt(busiest.hrs)+" hours, "+Math.round(busiest.hrs/87.6)+"% of the hours in the year. "+
    (mostDays && mostDays.days ? mostDays.name+" ran on the most days, "+fmt(mostDays.days)+". " : "")+
    (idle.length ? list(idle.map(r=>r.name))+" ran less than 25 hours. " : "")+
    (noxY!=null ? "Together the peakers emitted <b>"+fmt(noxY)+" tons of nitrogen oxides</b> in "+Y+(nox23!=null?", compared with "+fmt(nox23)+" in 2023":"")+
      "; Gowanus and Narrows accounted for "+fmt(gn)+" tons ("+Math.round(gn/noxY*100)+"%). " : "")+
    (noxYtd!=null ? "Through "+ytdEnd+" "+ytdY+" the total is "+fmt(noxYtd)+" tons." : "");
  w.append(lead);

  const box = el("div","runs");
  const sc = el("div","runscale");
  sc.innerHTML = "<div></div><div><span><span>0 hours</span><span>a full year, 8,760</span></span></div><div>"+Y+"</div>";
  box.append(sc);
  for(const r of rows){
    const row = el("div","runrow");
    const color = r.cc ? "var(--lilac)" : r.oil ? "var(--vermilion)" : "var(--rose)";
    row.innerHTML =
      "<div class='nm'><b>"+r.name+"</b>"+(r.cc?" <span class='sub'>(combined cycle)</span>":"")+"</div>"+
      "<div class='bar'><i style='width:"+Math.max(r.hrs>0?0.4:0, r.hrs/87.6).toFixed(2)+"%;background:"+color+"'></i></div>"+
      "<div>"+fmt(r.hrs)+" hours"+(r.days!=null?", "+fmt(r.days)+" days":"")+(r.nox!=null?", "+fmt(r.nox, r.nox<10?1:0)+" tons NOx":"")+
      "<div class='sub'>"+ytdY+" through "+ytdEnd+": "+fmt(r.hrsYtd)+" hours</div></div>";
    box.append(row);
  }
  w.append(box);
  const cap = el("p","note");
  cap.textContent = "Hours are those of each plant's busiest unit, so plants with many small turbines are not inflated by adding them up. Days are days on which any unit ran. NOx is nitrogen oxides, a smog-forming pollutant. Vermilion bars are plants that burn only oil or kerosene; the rest burn natural gas. Source: U.S. Environmental Protection Agency, Clean Air Markets Program Data, quarterly and daily emissions reporting.";
  w.append(cap);

  // status under the state peaker rule, plant by plant, each with its source
  const ruled = PR.plants.filter(p=>p.peakerRule && p.peakerRule.summary);
  const allGens = PR.plants.flatMap(p=>(p.retirement&&p.retirement.generators)||[]);
  const os = allGens.filter(g=>/^\(OS\)/.test(g.status||"")).length;
  const planned = allGens.filter(g=>g.plannedRetirement).length;
  const ul = el("ul","rulelist");
  for(const p of ruled){
    const seen = new Set(); const links = [];
    for(const src of p.peakerRule.sources||[]){ if(seen.has(src.url)) continue; seen.add(src.url);
      links.push("<a href='"+src.url+"' target='_blank' rel='noopener'>"+src.source.split(",")[0]+(/2025-Q3/.test(src.url)?", 2025 Q3":/2026-Q1/.test(src.url)?", 2026 Q1":"")+"</a>"); }
    const li = el("li"); li.innerHTML = "<b>"+shortPlant(p.plant)+"</b>: "+p.peakerRule.summary+" ("+links.join("; ")+")";
    ul.append(li);
  }
  const intro = el("p"); intro.style.margin = "0 0 8px";
  intro.textContent = "The state Department of Environmental Conservation's peaker rule (6 NYCRR Subpart 227-3) tightened nitrogen oxide limits for these turbines in stages from 2023 to 2025, and owners retired or idled units that could not meet them unless the grid operator, NYISO, found them needed for reliability. "+
    (ruled.length ? ruled.length+" of the "+PR.plants.length+" plants appear in NYISO's peaker rule records; no primary source tied the others to it. " : "")+
    "In EIA's "+((PR.sources.eia860mStatus||{}).file||"latest").replace("_generator"," ").replace(".xlsx","").replace(/^./,c=>c.toUpperCase())+" generator file, "+
    (planned ? planned+" units carry a planned retirement date" : "none of these plants' units carries a planned retirement date")+" and "+os+" are marked out of service.";
  const rb = el("div"); rb.append(intro, ul);
  w.append(fold("Status under the state's peaker rule", rb));

  const notes = PR.plants.filter(p=>p.notes && p.notes.length || !/lists one of the plant's EIA generator IDs/.test(p.match||""));
  w.append(fold("How the run hours are counted",
    "<p>Each plant's turbines report hourly operation and emissions to the EPA's Clean Air Markets Program. The page sums EPA's quarterly records by plant and year and counts days of operation from its daily records for "+Y+". "+
    "Plants were matched by EIA plant ID, which EPA uses as the facility code, and by generator ID. Output is gross megawatt-hours, before the plant's own use. "+
    "Data through "+ytdEnd+" "+ytdY+", the latest quarter EPA has published. Built "+(PR.generatedAt||"").slice(0,10)+" by <code>build-peaker-runs.py</code>.</p>"+
    "<p>Plant by plant:</p><ul class='rulelist'>"+notes.map(p=>"<li><b>"+shortPlant(p.plant)+"</b>: "+
      [/lists one of the plant's EIA generator IDs/.test(p.match||"")?"":p.match, ...(p.notes||[])].filter(Boolean).join(" ")+"</li>").join("")+"</ul>"));
  return w;
}

// a closed "more" note: the explanation is one click away instead of in the way
function fold(summary, html){
  const d=el("details","more"); const sm=el("summary"); sm.textContent=summary;
  const b=el("div","body"); if(html instanceof Node) b.append(html); else b.innerHTML=html;
  d.append(sm,b); return d;
}
function sectionTag(t){ const e=el("div","section-tag"); e.textContent=t; return e; }
function mini(k,v){ const w=el("div","mini"); const a=el("div","k"); a.textContent=k; const b=el("div","v"); b.textContent=v; w.append(a,b); return w; }
function statCard(label, big, unit, color, note){
  const c=el("div","stat"); c.style.setProperty("--accent",color);
  const l=el("div","label"); l.textContent=label;
  const b=el("div","big"); b.textContent=big; b.style.color=color;
  const u=el("span","unit"); u.textContent=" "+unit; b.append(u);
  const n=el("span","note"); n.textContent=label+". "+note;
  c.append(l,b,n); return c;
}

function donut(ordered, total, cleanPct, opts={}){
  const colors = opts.colors || FUEL_COLORS;
  const unit = opts.unit || "MW";
  const cap = opts.centerCap || "carbon-free";
  const big = !!opts.big;
  const size = big ? 230 : 200;
  const r=82, cx=100, cy=100, sw=26, C=2*Math.PI*r;
  const ns="http://www.w3.org/2000/svg";
  const wrap=el("div","donut-wrap"); if(big){ wrap.style.width=size+"px"; wrap.style.height=size+"px"; }
  const svg=document.createElementNS(ns,"svg"); svg.setAttribute("viewBox","0 0 200 200"); svg.style.width=size+"px"; svg.style.height=size+"px";
  let off=0;
  const bg=document.createElementNS(ns,"circle"); bg.setAttribute("cx",cx); bg.setAttribute("cy",cy); bg.setAttribute("r",r);
  bg.setAttribute("fill","none"); bg.setAttribute("stroke","var(--bg2)"); bg.setAttribute("stroke-width",sw); svg.append(bg);
  for(const o of ordered){
    const frac=o.mw/total;
    const arc=document.createElementNS(ns,"circle");
    arc.setAttribute("cx",cx); arc.setAttribute("cy",cy); arc.setAttribute("r",r);
    arc.setAttribute("fill","none"); arc.setAttribute("stroke",colors[o.name]||"var(--line)"); arc.setAttribute("stroke-width",sw);
    arc.setAttribute("stroke-dasharray", (frac*C)+" "+C);
    arc.setAttribute("stroke-dashoffset", -off*C);
    arc.setAttribute("transform","rotate(-90 "+cx+" "+cy+")");
    arc.style.cursor="pointer";
    arc.addEventListener("mousemove",e=>showTip('<div class="t-time">'+o.name+'</div><div class="t-row"><span>'+fmt(o.mw)+' '+unit+'</span><b>'+fmt(o.pct,1)+'%</b></div>', e.clientX, e.clientY));
    arc.addEventListener("mouseleave",hideTip);
    svg.append(arc); off+=frac;
  }
  wrap.append(svg);
  const center=el("div","donut-center");
  center.innerHTML='<div class="pct">'+fmt(cleanPct,0)+'%</div><div class="cap">'+cap+'</div>';
  wrap.append(center);
  return wrap;
}

function legend(ordered, total, opts={}){
  const colors = opts.colors || FUEL_COLORS;
  const unit = opts.unit || "MW";
  const w=el("div","legend");
  for(const o of ordered){
    const row=el("div","legrow");
    const sw=el("div","swatch"); sw.style.background=colors[o.name]||"var(--line)";
    const nm=el("div"); nm.textContent=o.name;
    const mw=el("div","mw"); mw.textContent=fmt(o.mw)+" "+unit;
    const pct=el("div","pct"); pct.textContent=fmt(o.pct,1)+"%";
    row.append(sw,nm,mw,pct); w.append(row);
  }
  return w;
}

// generic time-series line/area chart (SVG, responsive viewBox)
// opts.compare = {data:[{t,v}], color, label} draws a second dashed line (e.g. forecast / day-ahead)
function lineChart(series, opts){
  const {color="#fff", unit="", fill=false, dec=0, compare=null} = opts||{};
  const data = series.filter(d=>d.v!=null);
  const cmp = compare ? compare.data.filter(d=>d.v!=null) : [];
  const W=560, H=200, P={l:48,r:12,t:14,b:26};
  const ns="http://www.w3.org/2000/svg";
  const wrap=el("div","chart");
  if(compare){
    const lg=el("div"); lg.style.cssText="display:flex;gap:18px;font-size:12px;color:var(--muted);margin-bottom:6px";
    lg.innerHTML='<span><span style="display:inline-block;width:14px;height:3px;background:'+color+';vertical-align:middle;margin-right:5px"></span>'+(opts.label||"Actual")+'</span>'+
      '<span><span style="display:inline-block;width:14px;height:0;border-top:2px dashed '+compare.color+';vertical-align:middle;margin-right:5px"></span>'+compare.label+'</span>';
    wrap.append(lg);
  }
  const svg=document.createElementNS(ns,"svg"); svg.setAttribute("viewBox","0 0 "+W+" "+H);
  if(!data.length){ wrap.append(svg); return wrap; }
  const allV = data.map(d=>d.v).concat(cmp.map(d=>d.v));
  const vmax=Math.max(...allV), vmin=Math.min(...allV, 0);
  const NS=niceScale(Math.max(0,vmin), vmax); const ymax=NS.hi, ymin=NS.lo;
  const n=data.length;
  const x=i=> P.l + i/(n-1)*(W-P.l-P.r);
  const y=v=> H-P.b - (v-ymin)/(ymax-ymin)*(H-P.t-P.b);

  // gridlines + y labels
  for(const val of NS.ticks){
    const yy=y(val);
    const gl=document.createElementNS(ns,"line"); gl.setAttribute("class","gridline");
    gl.setAttribute("x1",P.l); gl.setAttribute("x2",W-P.r); gl.setAttribute("y1",yy); gl.setAttribute("y2",yy); svg.append(gl);
    const tx=document.createElementNS(ns,"text"); tx.setAttribute("x",P.l-8); tx.setAttribute("y",yy+3);
    tx.setAttribute("text-anchor","end"); tx.setAttribute("fill","var(--faint)"); tx.setAttribute("font-size","12"); tx.setAttribute("font-family","var(--sans)");
    tx.textContent=fmt(val,NS.dec); svg.append(tx);
  }
  // x labels (every ~4 hours)
  for(let i=0;i<n;i++){
    const mm=data[i].t.split("T")[1].slice(0,5);
    if(mm.endsWith(":00") && +mm.slice(0,2)%4===0){
      const tx=document.createElementNS(ns,"text"); tx.setAttribute("x",x(i)); tx.setAttribute("y",H-8);
      tx.setAttribute("text-anchor","middle"); tx.setAttribute("fill","var(--faint)"); tx.setAttribute("font-size","12"); tx.setAttribute("font-family","var(--sans)");
      tx.textContent=apHour(+mm.slice(0,2),0); svg.append(tx);
    }
  }

  const linePts=data.map((d,i)=>x(i)+","+y(d.v)).join(" ");
  if(fill){
    const grad="grad"+Math.random().toString(36).slice(2,7);
    const defs=document.createElementNS(ns,"defs");
    const lg=document.createElementNS(ns,"linearGradient"); lg.id=grad; lg.setAttribute("x1","0");lg.setAttribute("x2","0");lg.setAttribute("y1","0");lg.setAttribute("y2","1");
    const s1=document.createElementNS(ns,"stop"); s1.setAttribute("offset","0%"); s1.setAttribute("stop-color",color); s1.setAttribute("stop-opacity","0.32");
    const s2=document.createElementNS(ns,"stop"); s2.setAttribute("offset","100%"); s2.setAttribute("stop-color",color); s2.setAttribute("stop-opacity","0");
    lg.append(s1,s2); defs.append(lg); svg.append(defs);
    const area=document.createElementNS(ns,"polygon");
    area.setAttribute("points", P.l+","+(H-P.b)+" "+linePts+" "+(x(n-1))+","+(H-P.b));
    area.setAttribute("fill",color); area.setAttribute("fill-opacity","0.16"); svg.append(area);
  }
  const pl=document.createElementNS(ns,"polyline");
  pl.setAttribute("points",linePts); pl.setAttribute("fill","none"); pl.setAttribute("stroke",color); pl.setAttribute("stroke-width","2"); pl.setAttribute("stroke-linejoin","round");
  svg.append(pl);

  // comparison line (hourly) positioned by time-of-day within the primary span
  if(cmp.length){
    const mins=t=>{ const [h,m]=t.split("T")[1].split(":"); return +h*60+(+m); };
    const m0=mins(data[0].t), mN=mins(data[n-1].t), span=(mN-m0)||1;
    const xt=mm=>P.l + (mm-m0)/span*(W-P.l-P.r);
    const cpts=cmp.filter(d=>mins(d.t)>=m0 && mins(d.t)<=mN).map(d=>xt(mins(d.t))+","+y(d.v)).join(" ");
    const cl=document.createElementNS(ns,"polyline");
    cl.setAttribute("points",cpts); cl.setAttribute("fill","none"); cl.setAttribute("stroke",compare.color);
    cl.setAttribute("stroke-width","1.8"); cl.setAttribute("stroke-dasharray","5 4"); cl.setAttribute("opacity","0.9");
    svg.append(cl);
  }

  // last point dot
  const dot=document.createElementNS(ns,"circle"); dot.setAttribute("cx",x(n-1)); dot.setAttribute("cy",y(data[n-1].v)); dot.setAttribute("r",3.5); dot.setAttribute("fill",color); svg.append(dot);

  // hover layer
  const hoverLine=document.createElementNS(ns,"line"); hoverLine.setAttribute("stroke","var(--muted)"); hoverLine.setAttribute("stroke-width","1"); hoverLine.setAttribute("opacity","0"); hoverLine.setAttribute("y1",P.t); hoverLine.setAttribute("y2",H-P.b); svg.append(hoverLine);
  const hoverDot=document.createElementNS(ns,"circle"); hoverDot.setAttribute("r",4); hoverDot.setAttribute("fill",color); hoverDot.setAttribute("stroke","var(--bg)"); hoverDot.setAttribute("stroke-width","2"); hoverDot.setAttribute("opacity","0"); svg.append(hoverDot);
  const rect=document.createElementNS(ns,"rect"); rect.setAttribute("x",P.l); rect.setAttribute("y",P.t); rect.setAttribute("width",W-P.l-P.r); rect.setAttribute("height",H-P.t-P.b); rect.setAttribute("fill","transparent");
  rect.addEventListener("mousemove",e=>{
    const box=svg.getBoundingClientRect();
    const px=(e.clientX-box.left)/box.width*W;
    let i=Math.round((px-P.l)/(W-P.l-P.r)*(n-1)); i=Math.max(0,Math.min(n-1,i));
    const d=data[i];
    hoverLine.setAttribute("x1",x(i)); hoverLine.setAttribute("x2",x(i)); hoverLine.setAttribute("opacity","0.6");
    hoverDot.setAttribute("cx",x(i)); hoverDot.setAttribute("cy",y(d.v)); hoverDot.setAttribute("opacity","1");
    showTip('<div class="t-time">'+apTime(d.t)+'</div><div class="t-row"><span>'+ (unit) +'</span><b>'+fmt(d.v,dec)+'</b></div>', e.clientX, e.clientY);
  });
  rect.addEventListener("mouseleave",()=>{hideTip(); hoverLine.setAttribute("opacity","0"); hoverDot.setAttribute("opacity","0");});
  svg.append(rect);
  wrap.append(svg);
  return wrap;
}

// Daily time series over ~12 months: one point per day, month ticks on x, date hover.
// opts.metric = "energy" (GWh/day) | "peak" (MW); opts.zero starts the y-axis at 0 (required toggle).
function dailyChart(days, opts={}){
  const metric = opts.metric==="peak" ? "peak" : "energy";
  const zero = !!opts.zero;
  const unit = metric==="peak" ? "MW" : "GWh";
  const color = metric==="peak" ? cssVar("--orange") : cssVar("--cyan");
  const label = metric==="peak" ? "Peak demand" : "Energy used";
  const dec = metric==="peak" ? 0 : 1;
  const MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const ns="http://www.w3.org/2000/svg";
  const W=560, H=210, P={l:48,r:12,t:14,b:28};
  const wrap=el("div","chart");
  const svg=document.createElementNS(ns,"svg"); svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const data = days.filter(d=>d[metric]!=null);
  if(!data.length){ wrap.append(svg); return wrap; }
  const vals=data.map(d=>d[metric]);
  const vmax=Math.max(...vals), vlo=Math.min(...vals);
  const NS = niceScale(zero ? 0 : Math.max(0, vlo - (vmax-vlo)*0.05), vmax);
  const ymin = NS.lo, ymax = NS.hi;
  const n=data.length;
  const x=i=> P.l + i/(n-1)*(W-P.l-P.r);
  const y=v=> H-P.b - (v-ymin)/(ymax-ymin)*(H-P.t-P.b);

  // gridlines + y labels
  for(const val of NS.ticks){ const yy=y(val);
    const gl=document.createElementNS(ns,"line"); gl.setAttribute("class","gridline");
    gl.setAttribute("x1",P.l); gl.setAttribute("x2",W-P.r); gl.setAttribute("y1",yy); gl.setAttribute("y2",yy); svg.append(gl);
    const tx=document.createElementNS(ns,"text"); tx.setAttribute("x",P.l-8); tx.setAttribute("y",yy+3);
    tx.setAttribute("text-anchor","end"); tx.setAttribute("fill","var(--faint)"); tx.setAttribute("font-size","12"); tx.setAttribute("font-family","var(--sans)");
    tx.textContent=fmt(val,NS.dec); svg.append(tx);
  }
  // x labels at the first day of each month
  let lastMonth="";
  const secondStart = data.findIndex(r=>r.d.slice(5,7)!==data[0].d.slice(5,7));
  for(let i=0;i<n;i++){
    const [yy,mm]=data[i].d.split("-");
    if(mm!==lastMonth){
      lastMonth=mm;
      if(i===0 && secondStart>0 && secondStart<12) continue;
      const gl=document.createElementNS(ns,"line"); gl.setAttribute("class","gridline"); gl.setAttribute("opacity","0.5");
      gl.setAttribute("x1",x(i)); gl.setAttribute("x2",x(i)); gl.setAttribute("y1",P.t); gl.setAttribute("y2",H-P.b); svg.append(gl);
      const tx=document.createElementNS(ns,"text"); tx.setAttribute("x",x(i)); tx.setAttribute("y",H-9);
      tx.setAttribute("text-anchor","middle"); tx.setAttribute("fill","var(--faint)"); tx.setAttribute("font-size","12"); tx.setAttribute("font-family","var(--sans)");
      tx.textContent = MON3[+mm-1] + (mm==="01"? " '"+yy.slice(2) : "");
      svg.append(tx);
    }
  }

  // fill + line
  const linePts=data.map((d,i)=>x(i)+","+y(d[metric])).join(" ");
  const grad="dg"+metric;
  const defs=document.createElementNS(ns,"defs");
  const lg=document.createElementNS(ns,"linearGradient"); lg.id=grad; lg.setAttribute("x1","0");lg.setAttribute("x2","0");lg.setAttribute("y1","0");lg.setAttribute("y2","1");
  const s1=document.createElementNS(ns,"stop"); s1.setAttribute("offset","0%"); s1.setAttribute("stop-color",color); s1.setAttribute("stop-opacity","0.30");
  const s2=document.createElementNS(ns,"stop"); s2.setAttribute("offset","100%"); s2.setAttribute("stop-color",color); s2.setAttribute("stop-opacity","0");
  lg.append(s1,s2); defs.append(lg); svg.append(defs);
  const area=document.createElementNS(ns,"polygon");
  area.setAttribute("points", P.l+","+(H-P.b)+" "+linePts+" "+(x(n-1))+","+(H-P.b));
  area.setAttribute("fill",color); area.setAttribute("fill-opacity","0.16"); svg.append(area);
  const pl=document.createElementNS(ns,"polyline");
  pl.setAttribute("points",linePts); pl.setAttribute("fill","none"); pl.setAttribute("stroke",color); pl.setAttribute("stroke-width","1.4"); pl.setAttribute("stroke-linejoin","round"); svg.append(pl);

  // hover
  const hoverLine=document.createElementNS(ns,"line"); hoverLine.setAttribute("stroke","var(--muted)"); hoverLine.setAttribute("stroke-width","1"); hoverLine.setAttribute("opacity","0"); hoverLine.setAttribute("y1",P.t); hoverLine.setAttribute("y2",H-P.b); svg.append(hoverLine);
  const hoverDot=document.createElementNS(ns,"circle"); hoverDot.setAttribute("r",4); hoverDot.setAttribute("fill",color); hoverDot.setAttribute("stroke","var(--bg)"); hoverDot.setAttribute("stroke-width","2"); hoverDot.setAttribute("opacity","0"); svg.append(hoverDot);
  const rect=document.createElementNS(ns,"rect"); rect.setAttribute("x",P.l); rect.setAttribute("y",P.t); rect.setAttribute("width",W-P.l-P.r); rect.setAttribute("height",H-P.t-P.b); rect.setAttribute("fill","transparent");
  rect.addEventListener("mousemove",e=>{
    const box=svg.getBoundingClientRect();
    const px=(e.clientX-box.left)/box.width*W;
    let i=Math.round((px-P.l)/(W-P.l-P.r)*(n-1)); i=Math.max(0,Math.min(n-1,i));
    const d=data[i]; const [yy,mm,dd]=d.d.split("-");
    const dt=new Date(+yy,+mm-1,+dd); const dow=DOW[dt.getDay()];
    hoverLine.setAttribute("x1",x(i)); hoverLine.setAttribute("x2",x(i)); hoverLine.setAttribute("opacity","0.6");
    hoverDot.setAttribute("cx",x(i)); hoverDot.setAttribute("cy",y(d[metric])); hoverDot.setAttribute("opacity","1");
    showTip('<div class="t-time">'+dow+', '+MON_AP[+mm-1]+' '+(+dd)+', '+yy+'</div>'+
      '<div class="t-row"><span>'+label+'</span><b>'+fmt(d[metric],dec)+' '+unit+'</b></div>'+
      '<div class="t-row"><span>'+(metric==="peak"?"Energy used":"Peak demand")+'</span><b>'+(metric==="peak"?fmt(d.energy,1)+' GWh':fmt(d.peak,0)+' MW')+'</b></div>', e.clientX, e.clientY);
  });
  rect.addEventListener("mouseleave",()=>{hideTip(); hoverLine.setAttribute("opacity","0"); hoverDot.setAttribute("opacity","0");});
  svg.append(rect);
  wrap.append(svg);
  return wrap;
}

// Generic daily series: opts = {key, unit, label, dec, color, zero}. Nulls are gaps, not zeros.
function seriesChart(days, opts){
  const {key, unit, label, dec=0, color, zero=true} = opts;
  const MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const ns="http://www.w3.org/2000/svg", W=560, H=210, P={l:52,r:12,t:14,b:28};
  const wrap=el("div","chart"); const svg=document.createElementNS(ns,"svg"); svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const n=days.length; const vals=days.map(d=>d[key]).filter(v=>v!=null);
  if(!vals.length){ wrap.append(svg); return wrap; }
  const vmin=Math.min(...vals), vmax=Math.max(...vals);
  const NS=niceScale(zero ? Math.min(0,vmin) : vmin, vmax);
  const x=i=>P.l+i/(n-1)*(W-P.l-P.r), y=v=>H-P.b-(v-NS.lo)/(NS.hi-NS.lo)*(H-P.t-P.b);
  const T=(a,b,txt,anchor)=>{ const t=document.createElementNS(ns,"text"); t.setAttribute("x",a); t.setAttribute("y",b); t.setAttribute("text-anchor",anchor); t.setAttribute("fill","var(--faint)"); t.setAttribute("font-size","12"); t.textContent=txt; svg.append(t); };
  for(const v of NS.ticks){ const gl=document.createElementNS(ns,"line"); gl.setAttribute("class","gridline"); gl.setAttribute("x1",P.l); gl.setAttribute("x2",W-P.r); gl.setAttribute("y1",y(v)); gl.setAttribute("y2",y(v)); if(v===0) gl.setAttribute("stroke","var(--fg2)"); svg.append(gl); T(P.l-8,y(v)+4,fmt(v,NS.dec),"end"); }
  const starts=[]; let lastM=""; days.forEach((d,i)=>{ const mm=d.d.slice(5,7); if(mm!==lastM){ lastM=mm; starts.push(i); } });
  // a short partial first month would crowd the next label, so it goes unlabeled
  starts.forEach((i,k)=>{ if(k===0 && starts.length>1 && starts[1]<12) return; const [yy,mm]=days[i].d.split("-");
    T(x(i),H-9,MON3[+mm-1]+(mm==="01"?" '"+yy.slice(2):""),i===0?"start":"middle"); });
  // line with gaps where data is missing
  let seg=[]; const segs=[];
  days.forEach((d,i)=>{ if(d[key]==null){ if(seg.length) segs.push(seg); seg=[]; } else seg.push(x(i)+","+y(d[key])); }); if(seg.length) segs.push(seg);
  for(const sg of segs){ const pl=document.createElementNS(ns,"polyline"); pl.setAttribute("points",sg.join(" ")); pl.setAttribute("fill","none"); pl.setAttribute("stroke",color); pl.setAttribute("stroke-width","1.4"); pl.setAttribute("stroke-linejoin","round"); svg.append(pl); }
  const hl=document.createElementNS(ns,"line"); hl.setAttribute("stroke","var(--fg2)"); hl.setAttribute("opacity","0"); hl.setAttribute("y1",P.t); hl.setAttribute("y2",H-P.b); svg.append(hl);
  const rect=document.createElementNS(ns,"rect"); rect.setAttribute("x",P.l); rect.setAttribute("y",P.t); rect.setAttribute("width",W-P.l-P.r); rect.setAttribute("height",H-P.t-P.b); rect.setAttribute("fill","transparent");
  rect.addEventListener("mousemove",e=>{ const box=svg.getBoundingClientRect(); const px=(e.clientX-box.left)/box.width*W;
    let i=Math.round((px-P.l)/(W-P.l-P.r)*(n-1)); i=Math.max(0,Math.min(n-1,i)); const d=days[i];
    hl.setAttribute("x1",x(i)); hl.setAttribute("x2",x(i)); hl.setAttribute("opacity","0.5");
    showTip('<div class="t-time">'+apDay(d.d)+', '+d.d.slice(0,4)+'</div><div class="t-row"><span>'+label+'</span><b>'+(d[key]==null?"no data":fmt(d[key],dec)+" "+unit)+'</b></div>', e.clientX, e.clientY); });
  rect.addEventListener("mouseleave",()=>{ hideTip(); hl.setAttribute("opacity","0"); });
  svg.append(rect); wrap.append(svg); return wrap;
}

// Scatter of daily high temperature (x) vs NYC peak demand (y), one dot per summer day.
// `zero` starts the y-axis at 0 (the required zero-baseline toggle); default zooms to the data.
function scatterChart(points, line, opts={}){
  const {zero=false} = opts;
  const ns="http://www.w3.org/2000/svg";
  const W=560,H=300,P={l:56,r:14,t:12,b:32};
  const wrap=el("div","chart");
  const svg=document.createElementNS(ns,"svg"); svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const xmin=60,xmax=104;
  const peaks=points.map(p=>p[1]);
  const dmax=Math.max(...peaks), dmin=Math.min(...peaks);
  const NS=niceScale(zero?0:dmin*0.97, dmax*1.01);
  const ymax=NS.hi, ymin=NS.lo;
  const X=t=>P.l+(Math.max(xmin,Math.min(xmax,t))-xmin)/(xmax-xmin)*(W-P.l-P.r);
  const Y=v=>H-P.b-(v-ymin)/(ymax-ymin)*(H-P.t-P.b);
  for(const val of NS.ticks){ const yy=Y(val);
    const gl=document.createElementNS(ns,"line"); gl.setAttribute("class","gridline");
    gl.setAttribute("x1",P.l);gl.setAttribute("x2",W-P.r);gl.setAttribute("y1",yy);gl.setAttribute("y2",yy);svg.append(gl);
    const tx=document.createElementNS(ns,"text");tx.setAttribute("x",P.l-8);tx.setAttribute("y",yy+3);tx.setAttribute("text-anchor","end");tx.setAttribute("fill","var(--faint)");tx.setAttribute("font-size","12");tx.setAttribute("font-family","var(--sans)");tx.textContent=fmt(val);svg.append(tx);
  }
  for(let t=60;t<=100;t+=10){
    const tx=document.createElementNS(ns,"text");tx.setAttribute("x",X(t));tx.setAttribute("y",H-8);tx.setAttribute("text-anchor","middle");tx.setAttribute("fill","var(--faint)");tx.setAttribute("font-size","12");tx.setAttribute("font-family","var(--sans)");tx.textContent=t+"°";svg.append(tx);
  }
  const pxs=[],pys=[];
  for(const p of points){
    const cx=X(p[0]), cy=Y(p[1]); pxs.push(cx); pys.push(cy);
    const hot=p[0]>=95;
    const c=document.createElementNS(ns,"circle");
    c.setAttribute("cx",cx);c.setAttribute("cy",cy);c.setAttribute("r",hot?3.4:2.9);
    c.setAttribute("fill",hot?"var(--red)":"var(--cyan)");c.setAttribute("fill-opacity",hot?"0.9":"0.42");
    svg.append(c);
  }
  if(line&&line.length){
    const pts=line.filter(l=>l[0]>=xmin&&l[0]<=xmax).map(l=>X(l[0])+","+Y(l[1])).join(" ");
    const pl=document.createElementNS(ns,"polyline");pl.setAttribute("points",pts);pl.setAttribute("fill","none");pl.setAttribute("stroke","var(--amber)");pl.setAttribute("stroke-width","2.5");pl.setAttribute("stroke-linejoin","round");svg.append(pl);
  }
  const ring=document.createElementNS(ns,"circle");ring.setAttribute("r",6);ring.setAttribute("fill","none");ring.setAttribute("stroke","var(--text)");ring.setAttribute("stroke-width","1.5");ring.setAttribute("opacity","0");svg.append(ring);
  const rect=document.createElementNS(ns,"rect");rect.setAttribute("x",0);rect.setAttribute("y",0);rect.setAttribute("width",W);rect.setAttribute("height",H);rect.setAttribute("fill","transparent");
  rect.addEventListener("mousemove",e=>{
    const box=svg.getBoundingClientRect();
    const mx=(e.clientX-box.left)/box.width*W, my=(e.clientY-box.top)/box.height*H;
    let bi=-1,bd=1e9;
    for(let i=0;i<pxs.length;i++){const dx=pxs[i]-mx,dy=pys[i]-my,d=dx*dx+dy*dy;if(d<bd){bd=d;bi=i;}}
    if(bi<0||bd>400){hideTip();ring.setAttribute("opacity","0");return;}
    const p=points[bi];
    ring.setAttribute("cx",pxs[bi]);ring.setAttribute("cy",pys[bi]);ring.setAttribute("opacity","1");
    const feels=p[2]!=null?" · feels "+fmt(p[2],0)+"°":"";
    showTip('<div class="t-time">'+p[3]+'</div><div class="t-row"><span>high</span><b>'+fmt(p[0],1)+'°F'+feels+'</b></div><div class="t-row"><span>NYC peak</span><b>'+fmt(p[1])+' MW</b></div>', e.clientX, e.clientY);
  });
  rect.addEventListener("mouseleave",()=>{hideTip();ring.setAttribute("opacity","0");});
  svg.append(rect);
  wrap.append(svg);
  return wrap;
}

// "today vs normal" band chart: today's load over a typical-day band + prior-year overlays.
// All series share a fixed 00:00-24:00 time-of-day axis. Zero-based y so deviations aren't exaggerated.
function bandChart(today, band, priors){
  const W=560,H=240,P={l:48,r:12,t:14,b:26};
  const ns="http://www.w3.org/2000/svg";
  const wrap=el("div","chart");
  const slotMin=s=>{ const [h,m]=s.split(":"); return +h*60+(+m); };
  const x=mins=>P.l + mins/1440*(W-P.l-P.r);
  const allMax=Math.max(
    ...band.map(b=>b.p90),
    ...priors.flatMap(p=>p.curve.map(c=>c.nyc)),
    ...today.map(t=>t.v)
  );
  const NS=niceScale(0, allMax); const ymax=NS.hi;
  const y=v=>H-P.b-(v/ymax)*(H-P.t-P.b);
  const svg=document.createElementNS(ns,"svg"); svg.setAttribute("viewBox","0 0 "+W+" "+H);

  // y gridlines
  for(const val of NS.ticks){ const yy=y(val);
    const gl=document.createElementNS(ns,"line"); gl.setAttribute("class","gridline");
    gl.setAttribute("x1",P.l);gl.setAttribute("x2",W-P.r);gl.setAttribute("y1",yy);gl.setAttribute("y2",yy);svg.append(gl);
    const tx=document.createElementNS(ns,"text"); tx.setAttribute("x",P.l-8);tx.setAttribute("y",yy+3);tx.setAttribute("text-anchor","end");
    tx.setAttribute("fill","var(--faint)");tx.setAttribute("font-size","12");tx.setAttribute("font-family","var(--sans)");
    tx.textContent=fmt(val); svg.append(tx);
  }
  for(let hh=0;hh<=24;hh+=4){ const tx=document.createElementNS(ns,"text");
    tx.setAttribute("x",x(hh*60));tx.setAttribute("y",H-8);tx.setAttribute("text-anchor","middle");
    tx.setAttribute("fill","var(--faint)");tx.setAttribute("font-size","12");tx.setAttribute("font-family","var(--sans)");
    tx.textContent=apHour(hh%24,0); svg.append(tx);
  }

  // p10-p90 band
  const top=band.map(b=>x(slotMin(b.slot))+","+y(b.p90));
  const bot=band.slice().reverse().map(b=>x(slotMin(b.slot))+","+y(b.p10));
  const poly=document.createElementNS(ns,"polygon"); poly.setAttribute("points",top.concat(bot).join(" "));
  poly.setAttribute("fill","var(--blue)"); poly.setAttribute("opacity","0.13"); svg.append(poly);
  // median dashed
  const med=document.createElementNS(ns,"polyline"); med.setAttribute("points",band.map(b=>x(slotMin(b.slot))+","+y(b.median)).join(" "));
  med.setAttribute("fill","none"); med.setAttribute("stroke","var(--blue)"); med.setAttribute("stroke-width","1.6"); med.setAttribute("stroke-dasharray","5 4"); med.setAttribute("opacity","0.8"); svg.append(med);
  // prior years (thin, faint)
  const priorColors=["var(--purple)","var(--lime)","var(--orange)"];
  priors.forEach((p,i)=>{ const pl=document.createElementNS(ns,"polyline");
    pl.setAttribute("points",p.curve.map(c=>x(slotMin(c.slot))+","+y(c.nyc)).join(" "));
    pl.setAttribute("fill","none"); pl.setAttribute("stroke",priorColors[i%3]); pl.setAttribute("stroke-width","1.2"); pl.setAttribute("opacity","0.5"); svg.append(pl);
  });
  // today (bold)
  const td=document.createElementNS(ns,"polyline"); td.setAttribute("points",today.map(t=>x(slotMin(t.slot))+","+y(t.v)).join(" "));
  td.setAttribute("fill","none"); td.setAttribute("stroke","var(--amber)"); td.setAttribute("stroke-width","2.6"); td.setAttribute("stroke-linejoin","round"); svg.append(td);
  const last=today[today.length-1];
  if(last){ const dot=document.createElementNS(ns,"circle"); dot.setAttribute("cx",x(slotMin(last.slot))); dot.setAttribute("cy",y(last.v)); dot.setAttribute("r",3.8); dot.setAttribute("fill","var(--amber)"); svg.append(dot); }

  wrap.append(svg);
  return wrap;
}

// stacked area for fuel mix
function stackedArea(fuelMix){
  const W=560,H=220,P={l:48,r:12,t:14,b:26};
  const ns="http://www.w3.org/2000/svg";
  const wrap=el("div","chart");
  const svg=document.createElementNS(ns,"svg"); svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const n=fuelMix.length;
  const totals=fuelMix.map(f=>f.total);
  const NS=niceScale(0, Math.max(...totals)); const ymax=NS.hi;
  const x=i=>P.l+i/(n-1)*(W-P.l-P.r);
  const y=v=>H-P.b-(v/ymax)*(H-P.t-P.b);

  for(const val of NS.ticks){ const yy=y(val);
    const gl=document.createElementNS(ns,"line"); gl.setAttribute("class","gridline");
    gl.setAttribute("x1",P.l);gl.setAttribute("x2",W-P.r);gl.setAttribute("y1",yy);gl.setAttribute("y2",yy);svg.append(gl);
    const tx=document.createElementNS(ns,"text"); tx.setAttribute("x",P.l-8);tx.setAttribute("y",yy+3);tx.setAttribute("text-anchor","end");
    tx.setAttribute("fill","var(--faint)");tx.setAttribute("font-size","12");tx.setAttribute("font-family","var(--sans)");
    tx.textContent=fmt(val); svg.append(tx);
  }
  for(let i=0;i<n;i++){
    const mm=fuelMix[i].t.split("T")[1].slice(0,5);
    if(mm.endsWith(":00") && +mm.slice(0,2)%4===0){
      const tx=document.createElementNS(ns,"text"); tx.setAttribute("x",x(i));tx.setAttribute("y",H-8);tx.setAttribute("text-anchor","middle");
      tx.setAttribute("fill","var(--faint)");tx.setAttribute("font-size","12");tx.setAttribute("font-family","var(--sans)"); tx.textContent=apHour(+mm.slice(0,2),0); svg.append(tx);
    }
  }
  // build cumulative bands bottom-up using FUEL_ORDER reversed so fossil sits on top
  const stackOrder=[...FUEL_ORDER];
  const base=new Array(n).fill(0);
  for(const fuel of stackOrder){
    const top=base.map((b,i)=> b + (fuelMix[i].cats[fuel]||0));
    const pts=[];
    for(let i=0;i<n;i++) pts.push(x(i)+","+y(top[i]));
    for(let i=n-1;i>=0;i--) pts.push(x(i)+","+y(base[i]));
    const poly=document.createElementNS(ns,"polygon");
    poly.setAttribute("points",pts.join(" ")); poly.setAttribute("fill",FUEL_COLORS[fuel]); poly.setAttribute("opacity","0.85"); poly.setAttribute("stroke",FUEL_COLORS[fuel]); poly.setAttribute("stroke-width","0.4");
    svg.append(poly);
    for(let i=0;i<n;i++) base[i]=top[i];
  }
  // hover
  const hoverLine=document.createElementNS(ns,"line"); hoverLine.setAttribute("stroke","#fff"); hoverLine.setAttribute("stroke-width","1"); hoverLine.setAttribute("opacity","0"); hoverLine.setAttribute("y1",P.t);hoverLine.setAttribute("y2",H-P.b); svg.append(hoverLine);
  const rect=document.createElementNS(ns,"rect"); rect.setAttribute("x",P.l);rect.setAttribute("y",P.t);rect.setAttribute("width",W-P.l-P.r);rect.setAttribute("height",H-P.t-P.b);rect.setAttribute("fill","transparent");
  rect.addEventListener("mousemove",e=>{
    const box=svg.getBoundingClientRect(); const px=(e.clientX-box.left)/box.width*W;
    let i=Math.round((px-P.l)/(W-P.l-P.r)*(n-1)); i=Math.max(0,Math.min(n-1,i));
    const f=fuelMix[i];
    hoverLine.setAttribute("x1",x(i));hoverLine.setAttribute("x2",x(i));hoverLine.setAttribute("opacity","0.5");
    let rows='<div class="t-time">'+apTime(f.t)+', '+fmt(f.total)+' MW</div>';
    for(const fuel of [...FUEL_ORDER].reverse()){
      if(f.cats[fuel]==null) continue;
      rows+='<div class="t-row"><span style="color:'+FUEL_COLORS[fuel]+'">■</span><span style="flex:1;margin-left:4px">'+fuel+'</span><b>'+fmt(f.cats[fuel])+'</b></div>';
    }
    showTip(rows, e.clientX, e.clientY);
  });
  rect.addEventListener("mouseleave",()=>{hideTip();hoverLine.setAttribute("opacity","0");});
  svg.append(rect);
  wrap.append(svg);
  return wrap;
}

function buildOpening(D, B, HD, ctx){
  const L = D.latest;
  const finding = document.getElementById("finding"), lede = document.getElementById("lede"), banner = document.getElementById("banner");
  // typical load at this 5-minute slot, same kind of day, past four weeks
  let typ = null, kind = "day";
  if(B?.typicalDay?.slots?.length){
    const sl = hhmm(L.t).slice(0,3) + pad2(Math.floor(+hhmm(L.t).slice(3)/5)*5);
    typ = B.typicalDay.slots.find(s=>s.slot===sl)?.median ?? null;
    kind = B.typicalDay.dayType==="weekday" ? "weekday" : "weekend day or holiday";
  }
  let f = "New York City is drawing <span class='n'>"+fmt(L.nycLoadMW)+" megawatts</span> as of "+apTime(L.t);
  if(typ){
    const d = (L.nycLoadMW/typ-1)*100;
    f += Math.abs(d) < 3 ? ", about what a typical recent "+kind+" draws at this hour."
       : ", "+fmt(Math.abs(d),0)+"% "+(d>0?"more":"less")+" than a typical recent "+kind+" at this hour.";
  } else f += ".";
  finding.innerHTML = f;

  const parts = [];
  if(L.nycPriceLbmp!=null){
    let pr = "Wholesale power in the city costs <b>$"+fmt(L.nycPriceLbmp,2)+" a megawatt-hour</b> ("+fmt(ctx.centsKwh,1)+" cents a kilowatt-hour, before delivery charges and taxes)";
    if(L.nycDayAheadLbmp!=null){
      const v = L.rtVsDaPct;
      pr += Math.abs(v) < 5 ? ", close to the $"+fmt(L.nycDayAheadLbmp,0)+" the day-ahead market set for this hour."
          : ", "+fmt(Math.abs(v),0)+"% "+(v>0?"above":"below")+" the $"+fmt(L.nycDayAheadLbmp,0)+" the day-ahead market set for this hour.";
    } else pr += ".";
    parts.push(pr);
  }
  if(L.chpeMW!=null){
    parts.push("The Champlain Hudson Power Express is scheduled to carry <b>"+fmt(L.chpeMW)+" MW of Quebec hydropower</b> into Queens, about "+fmt(L.chpeMW/L.nycLoadMW*100,0)+"% of the city's draw.");
  }
  if(L.fuelCats){
    const st = mixStats(L.fuelCats, D.co2FactorsLbsPerMWh, CLEAN);
    const upstate = ((L.fuelCats["Nuclear"]||0)+(L.fuelCats["Hydro"]||0))/st.cleanMW*100;
    parts.push("Statewide, <b>"+fmt(st.cleanPct,0)+"% of generation is carbon-free</b> right now"+(upstate>75? ", nearly all of it upstate nuclear and hydro; the plants inside the city burn gas." : "."));
  }
  const fcToday = (D.forecast||[]).filter(x=>x.t.startsWith(D.sourceDate));
  const fcPeak = fcToday.reduce((m,x)=>x.nyc>m.nyc?x:m, {nyc:-1,t:null});
  if(fcPeak.t && fcPeak.t > L.t){
    parts.push("NYISO expects today's peak near <b>"+fmt(fcPeak.nyc)+" MW around "+apTime(fcPeak.t)+"</b>; the high so far is "+fmt(L.peakNyc.mw)+" MW at "+apTime(L.peakNyc.t)+".");
  } else if(L.peakNyc?.t){
    parts.push("Today's peak so far is <b>"+fmt(L.peakNyc.mw)+" MW at "+apTime(L.peakNyc.t)+"</b>.");
  }
  lede.innerHTML = tidy(parts.join(" "));

  // High-demand mode: a sun-yellow band when the grid is (or is forecast to be) stretched.
  const tomorrow = addDaysIso(D.sourceDate, 1);
  const fcTom = (D.forecast||[]).filter(x=>x.t.startsWith(tomorrow));
  const tomPeak = fcTom.reduce((m,x)=>x.nyc>m.nyc?x:m, {nyc:-1,t:null});
  const oilNow = L.fuelCats?.["Other Fossil Fuels"] || 0;
  const rec = HD?.stats?.maxPeak ? " The highest city load in this page's records is "+fmt(HD.stats.maxPeak)+" MW." : "";
  const msgs = [];
  if(fcPeak.nyc >= 9500 && fcPeak.t > L.t) msgs.push("NYISO forecasts New York City will peak near <b>"+fmt(fcPeak.nyc)+" MW around "+apTime(fcPeak.t)+" today</b>, heat-wave territory.");
  else if(tomPeak.nyc >= 9500) msgs.push("NYISO forecasts New York City will peak near <b>"+fmt(tomPeak.nyc)+" MW tomorrow around "+apTime(tomPeak.t)+"</b>, heat-wave territory.");
  if(L.nycPriceLbmp >= 150) msgs.push("The real-time price has jumped to <b>$"+fmt(L.nycPriceLbmp,0)+" a megawatt-hour</b>.");
  if(oilNow >= 100) msgs.push("Oil-fired plants, the grid's last resort, are generating <b>"+fmt(oilNow)+" MW</b> statewide.");
  banner.innerHTML = msgs.length ? '<div class="banner"><b>High demand.</b> '+msgs.join(" ")+(msgs.length? " On days like this the city leans on its peaker plants, mapped below."+rec : "")+'</div>' : "";
}

function buildMethod(D){
  const factors=Object.entries(D.co2FactorsLbsPerMWh).map(([k,v])=>'<tr><td>'+k+'</td><td class="n">'+v+'</td></tr>').join("");
  document.getElementById("method").innerHTML = `
    <p>This page reads public real-time feeds published by the New York Independent System Operator (NYISO) and refreshes them about every 5 minutes. Every number traces back to a NYISO CSV; any modeling or smoothing is stated below.</p>

    <h4>Data sources</h4>
    <ul>
      <li><b>Load (demand):</b> <code>pal</code> feed — actual load by zone, 5-minute resolution. New York City is NYISO Zone J, labeled <code>N.Y.C.</code> Statewide load is the sum of all 11 zones.</li>
      <li><b>Generation mix:</b> <code>rtfuelmix</code> feed — real-time output by fuel category, 5-minute resolution. <b>This is reported statewide, not per zone.</b> NYISO does not publish a New York City-only fuel mix in real time, so the mix shown reflects all of New York State, including upstate hydro and nuclear that New York City draws on through the transmission system. This feed counts <b>in-state generation only</b> — electricity imported over interties such as the Champlain Hudson Power Express (Hydro-Québec) is recorded as interchange, not generation, so it does not appear in the fuel mix even though it physically powers the city. To surface it, the live statewide mix shows a <b>derived net-imports figure</b> = statewide load (summed across all 11 zones from the <code>pal</code> load feed) minus total in-state generation. This equals net flow over all interties (Québec, New England, PJM) but is <b>approximate</b>: it also absorbs transmission losses and pumped-storage charging, and load and generation are read on slightly offset five-minute grids. It is not broken out by source because NYISO does not publish imports by fuel in real time. For annual scale, New York imported 38,785 GWh and exported 18,148 GWh in 2024 — net imports of about 20,600 GWh, per the NYISO 2025 Gold Book.</li>
      <li><b>Price:</b> <code>realtime_zone</code> feed — real-time locational-based marginal price (LBMP) by zone, in dollars per megawatt-hour ($/MWh).</li>
      <li><b>Load forecast:</b> <code>isolf</code> feed — NYISO's own zonal load forecast in MW, hourly. This is the <i>same metric</i> (zonal load) from the <i>same operator</i> as the actual load above, which is why the two can be compared directly. The only difference is cadence: the forecast is hourly and set ahead of time, actual load is every 5 minutes.</li>
      <li><b>Day-ahead price:</b> <code>damlbmp_zone</code> feed — day-ahead market LBMP by zone ($/MWh, hourly), cleared the evening before. It is the same LBMP definition as the real-time price, so the two compare directly; the gap between them is the difference between what the market expected and what actually happened.</li>
      <li><b>Quebec line:</b> <code>ExternalLimitsFlows</code> feed, the row labeled <code>SCH - HQ_CHPE</code>: the scheduled flow on the Champlain Hudson Power Express intertie, 5-minute resolution, with its 1,250 MW limit. It is a schedule, not a metered flow; the two normally match closely on a direct-current line, but the page labels it as scheduled.</li>
      <li><b>Tomorrow's prices:</b> the next day's <code>damlbmp_zone</code> file, which NYISO posts late in the morning. Until it appears, the look-ahead uses the <code>isolf</code> load forecast.</li>
    </ul>
    <p><b>On comparators:</b> every comparison on this page is drawn between series that share a definition and a source. Forecast-vs-actual and day-ahead-vs-real-time are both NYISO measuring the same quantity two ways. We do not overlay outside datasets whose definitions differ — for example, federal U.S. Energy Information Administration (EIA) "demand" is derived differently from NYISO metered "load," and EIA fuel categories (coal, solar, petroleum) do not map onto NYISO's ("Dual Fuel," "Other Fossil Fuels"), so mixing them would mislead.</p>

    <h4>How the headline numbers are built</h4>
    <ul>
      <li><b>NYC power draw</b> is the most recent Zone J load reading, in megawatts (MW).</li>
      <li><b>Share of state</b> = NYC load ÷ statewide load at the same timestamp.</li>
      <li><b>Wholesale price</b> is the latest Zone J LBMP. The cents-per-kilowatt-hour figure = $/MWh ÷ 10.</li>
      <li><b>Wholesale spend rate</b> ≈ NYC load (MW) × NYC price ($/MWh) = dollars per hour. The "so far today" total integrates load × price across each 5-minute interval since midnight.</li>
    </ul>

    <h4>The opening sentences</h4>
    <p>The sentences at the top are written by the page from the same numbers shown below: the latest Zone J load against the median of recent same-type days at the same 5-minute slot (within 3% reads as about typical), the latest real-time price against the day-ahead price for that hour, the latest scheduled Quebec flow, the statewide carbon-free share and NYISO's forecast peak. A notice appears when the forecast peak reaches 9,500 MW, the real-time price reaches $150 per MWh or oil-fired output statewide reaches 100 MW. Those thresholds are the page's own markers of a strained day, not NYISO alert levels.</p>

    <h4>A year on the grid</h4>
    <p>Built once a day by <code>build-daily-grid.py</code> from NYISO's monthly archives of the same feeds (<code>realtime_zone</code>, <code>damlbmp_zone</code>, <code>rtfuelmix</code>, <code>pal</code> and <code>ExternalLimitsFlows</code>), one row per day for the past 365 days: average and highest real-time price, average day-ahead price, statewide carbon-free share and carbon rate, average load, net imports and the average and highest scheduled Quebec flow. Days already captured are kept, so the record does not shrink when NYISO's per-day files expire. Where 5-minute load files are missing, NYISO's hourly integrated load fills in.</p>

    <h4>Peaker run hours</h4>
    <p>Operating hours, output and emissions come from the U.S. Environmental Protection Agency's Clean Air Markets Program Data, which every fossil turbine of this size reports to hourly. <code>build-peaker-runs.py</code> matches each EIA plant to its EPA units, sums the quarterly records by year and counts days of operation from the daily records. Status under the state peaker rule comes from NYISO's quarterly reliability reports and state permit records, each linked where it is cited; generator status comes from the newest EIA Form 860M file. The script is re-run by hand when EPA publishes a new quarter.</p>

    <h4>Indian Point toggle (illustrative)</h4>
    <p>The "if Indian Point ran" toggle on the generation mix is a counterfactual, clearly labeled as such. It adds 2,060 MW of nuclear — the net summer capacity of the retired Indian Point Energy Center (Unit 2 ~1,020 MW, retired April 30, 2020; Unit 3 ~1,040 MW, retired April 30, 2021, per the U.S. Energy Information Administration) — and removes an equal amount of fossil generation proportionally across natural gas, dual-fuel and other fossil fuels, holding total generation equal to demand. Nuclear plants run as baseload near full output around the clock, so adding the full capacity is a reasonable illustration of scale. It is <i>not</i> a precise simulation: in reality the market would have dispatched plants differently, and prices and interchange would differ. Capacity and dates are verified facts; the displacement is the stated assumption.</p>

    <h4>Downstate generation mix and city solar</h4>
    <p>The lead "how the New York City region is powered" figures come from the NYISO 2025 Power Trends report, Figure 23 (2024 energy production), for the downstate region — NYISO Zones F through K, which cover New York City, Long Island and the lower Hudson Valley. These are annual figures, not real-time, and represent energy <i>produced</i> in the downstate region; the region also receives power over transmission from upstate and neighboring grids. The statewide live mix is shown separately because it is the only fuel mix NYISO publishes in real time. The citywide solar figures (about 641.5 MW installed in 2025, against a 1-gigawatt-by-2030 citywide goal) come from the New York City Independent Budget Office's December 2025 Solar Power Progress Report; that citywide goal is distinct from the Local Law 99 mandate of 100 MW on city-owned buildings.</p>

    <h4>Grid carbon intensity by city</h4>
    <p>Carbon intensity (grams of CO₂ per kWh) is a grid-level quantity, so each city is mapped to the grid it sits on. U.S. cities use their U.S. EPA eGRID2023 subregion CO₂ total output emission rate (lb/MWh, converted at 0.4536 g/kWh per lb/MWh) — the most local official figure; New York City has its own subregion (NYC/Westchester), while others such as Chicago's (RFC West) span multiple states, so a city's own utility may differ. International cities use their national grid's CO₂ intensity of generation from Our World in Data (Ember / Energy Institute), 2024. These are annual averages from two source families and are not directly comparable to the real-time, statewide figure shown in the carbon-intensity card above. New York City's local subregion is unusually gas-heavy (~98% of in-city generation), which is why it ranks high.</p>

    <h4>Peaker plants</h4>
    <p>Plant locations come from U.S. EIA Form 860M, the federal inventory of every operating generator (with coordinates, prime mover, capacity and sector). We count a plant as a New York City peaker if it sits in the five boroughs, its prime mover is a simple-cycle combustion turbine (GT) or internal-combustion engine (IC), and it is in the Electric Utility or merchant independent power producer (IPP) sector. That last filter excludes the many hospital, university and commercial backup/cogeneration engines EIA also lists, which are not grid peaking plants. NYISO does not publish unit-level real-time output, so the dashboard cannot show which individual plants are running at a given moment; the "dispatchable fossil generation" figures are statewide fuel-category totals from the live feed, shown as the closest public proxy for peaking activity.</p>

    <h4>Historical comparison ("a normal day")</h4>
    <p>The "how today compares" chart uses NYISO's <code>pal</code> load files, which are byte-identical to the live feed. The shaded band is the 10th–90th percentile of New York City load, per 5-minute slot, across the past 28 days that are the same kind of day as today (today excluded): working weekdays, or weekends and holidays (New Year's Day, Memorial Day, July 4, Labor Day, Thanksgiving and the day after, Christmas), which run structurally lower. The dashed line is the median. Each reading is bucketed to its 5-minute slot and averaged within the day so all days align to a 288-slot grid. The day-by-day curves come from a history file this project keeps itself, because NYISO's own current-month archive can be sparse and its per-day files disappear after about eight days. Prior-year lines are the same weekday 52, 104 and 156 weeks back (a week earlier if that day was a holiday and today isn't), from NYISO's monthly archive ZIPs. The "now vs typical" figure compares current load with the median at the same 5-minute slot. Year-to-year and day-to-day swings are driven mostly by weather, not a trend.</p>

    <h4>Plain-language conversions</h4>
    <ul>
      <li><b>Window AC for an hour:</b> assumes a 1,000-watt unit; one hour = 1 kilowatt-hour, costed at the current wholesale price. Wholesale energy only.</li>
      <li><b>Per New Yorker:</b> the city's total wholesale energy cost (load × price integrated over the day) divided by 8,804,190 residents (2020 U.S. Census). This spreads the cost of all city electricity use — residential, commercial, transit, industrial — across every person, so it is a scale comparison, not an individual bill.</li>
      <li>The residential all-in rate range (25–35¢/kWh) is external context for why retail bills exceed wholesale; it is not from the NYISO feed.</li>
    </ul>

    <h4>Carbon intensity</h4>
    <p>Carbon dioxide rate = (Σ generation by fuel × emission factor) ÷ total generation, in pounds of CO₂ per MWh, using the statewide mix. Factors are operational combustion estimates (U.S. Energy Information Administration averages); lifecycle and upstream emissions are excluded. Dual-fuel units are assumed gas-fired.</p>
    <table><tr><th>Fuel category</th><th class="n">lbs CO₂ / MWh</th></tr>${factors}</table>

    <h4>Important caveats</h4>
    <ul>
      <li>Fuel mix is <b>statewide</b>; New York City's in-city generation is predominantly natural gas, so the local mix is dirtier than the statewide figure when imports are constrained.</li>
      <li><b>Behind-the-meter rooftop solar is not in the fuel mix.</b> NYISO's real-time feed counts only grid-connected generation, and the "Other Renewables" category is grid-scale. Distributed rooftop solar reduces metered demand rather than registering as supply, so the carbon-free share is understated on sunny days. New York had roughly <b>7,500 MW</b> of behind-the-meter solar by 2025 — up to ~4,800 MW of midday output and about 1,600 MW (~5%) of summer-peak reduction — none of which appears here (NYISO 2025 Gold Book, Tables I-9a/c/d). It does not affect the derived net-imports figure, because rooftop output is netted out of both measured load and metered generation.</li>
      <li>LBMP is the <b>wholesale energy commodity price only.</b> It excludes delivery, capacity, ancillary services and taxes. New York residential electricity averaged about <b>29¢/kWh</b> in 2026 (U.S. Energy Information Administration), while the 2025 statewide wholesale average was about <b>7¢/kWh</b> — so a retail bill (e.g. Con Edison) runs roughly three to four times the wholesale energy price. The retail figure is an external comparison, not from NYISO.</li>
      <li>Feeds are real-time operational data and may be revised by NYISO afterward. Times are U.S. Eastern.</li>
    </ul>
    <p>Snapshot generated <code>${D.generatedAt}</code> from source date <code>${D.sourceDate}</code>.</p>
  `;
}
