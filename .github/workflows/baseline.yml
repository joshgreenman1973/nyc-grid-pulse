name: Rebuild historical baseline

# Rebuilds data/baseline.json (typical-weekday band + prior-year same-date curves).
# Daily is plenty — the band shifts slowly as the month accumulates weekdays.

on:
  schedule:
    - cron: "20 6 * * *"   # 06:20 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build baseline
        run: node build-baseline.mjs
      - name: Build rolling 12-month daily load
        run: python3 build-daily-load.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/baseline.json data/daily-load.json
          if git diff --staged --quiet; then
            echo "No change in baseline or daily load."
          else
            git commit -m "Rebuild historical baseline + daily load [skip ci]"
            git push
          fi
