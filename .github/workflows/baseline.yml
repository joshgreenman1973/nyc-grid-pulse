name: Rebuild historical baseline

# Backstop only: the refresh loop (refresh.yml) rebuilds these once each new Eastern day.
# Rebuilds data/daily-load.json, data/history/nyc-load-curves.json and data/baseline.json.

on:
  schedule:
    - cron: "20 6 * * *"   # 06:20 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # daily load first: it writes data/history/nyc-load-curves.json, which the baseline reads
      - name: Build rolling 12-month daily load
        run: python3 build-daily-load.py
      - name: Build baseline
        run: node build-baseline.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/baseline.json data/daily-load.json data/history
          if git diff --staged --quiet; then
            echo "No change in baseline or daily load."
          else
            git commit -m "Rebuild historical baseline + daily load [skip ci]"
            # the refresh loop commits every few minutes, so rebase onto it first
            for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q && break; sleep $((i*5)); done
          fi
