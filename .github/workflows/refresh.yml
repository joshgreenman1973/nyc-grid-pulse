name: Refresh NYISO grid data

# Keeps data/latest.json current by re-pulling the NYISO real-time feeds.
# Runs every 15 minutes (the feeds publish at 5-minute resolution).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Fetch latest grid data
        run: node fetch-data.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "No change in grid data."
          else
            git commit -m "Refresh NYISO grid snapshot [skip ci]"
            git push
          fi
